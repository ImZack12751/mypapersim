/* ==========================================================================
   3. PAPER LOADING AND VALIDATION
   ========================================================================== */

/**
 * "image" / "images" -> [{src, alt, caption, width}].
 * Accepts a string, an object {src|url|path, alt, caption, width} or an array of either.
 * imageAlt / imageCaption apply to the first image when it has none of its own.
 */
function normImages(value, alt, caption, label, warnings) {
  const list = value == null || value === '' ? [] : Array.isArray(value) ? value : [value];
  const out = [];
  list.forEach((v, k) => {
    const o = typeof v === 'string' ? { src: v } : v && typeof v === 'object' ? v : null;
    const src = o ? String(o.src ?? o.url ?? o.path ?? '').trim() : '';
    if (!o || !src) { warnings.push(`${label}: image ${k + 1} has no "src", so it was skipped.`); return; }
    if (!safeImageSrc(src)) { warnings.push(`${label}: image "${src.slice(0, 50)}" is not a supported link (use a relative path, http(s) URL or data:image URI).`); return; }
    out.push({
      src,
      alt: String(o.alt ?? (k === 0 ? alt ?? '' : '')),
      caption: String(o.caption ?? (k === 0 ? caption ?? '' : '')),
      width: /^\d+(\.\d+)?(px|%|em|rem|mm|cm)?$/.test(String(o.width ?? '')) ? (/\d$/.test(String(o.width)) ? `${o.width}px` : String(o.width)) : '',
    });
  });
  return out;
}

/** "table" / "tables" -> [{headers, rows, caption}]. Throws for a table that cannot be drawn. */
function normTables(value, label, warnings) {
  if (value == null) return [];
  const list = Array.isArray(value) ? value : [value];
  return list.map((t, k) => {
    const name = `${label}, table ${list.length > 1 ? k + 1 : ''}`.trim().replace(/,\s*$/, '');
    if (!t || typeof t !== 'object' || Array.isArray(t)) throw new Error(`${name}: "table" must be an object like {"headers": [...], "rows": [[...]]}.`);
    if (t.headers != null && !Array.isArray(t.headers)) throw new Error(`${name}: "headers" must be an array of strings.`);
    if (!Array.isArray(t.rows) || !t.rows.length || !t.rows.every(Array.isArray)) throw new Error(`${name}: "rows" must be a non-empty array of arrays, e.g. [["0.20", "0.90"], ...].`);
    const headers = (t.headers || []).map(h => (h == null ? '' : String(h)));
    const width = Math.max(headers.length, ...t.rows.map(r => r.length));
    const rows = t.rows.map((r, i) => {
      if (r.length !== width) warnings.push(`${name}: row ${i + 1} has ${r.length} cells but the table is ${width} wide (padded with blanks).`);
      return [...r.map(c => (c == null ? '' : String(c))), ...Array(width - r.length).fill('')];
    });
    return { headers: headers.length && headers.length < width ? [...headers, ...Array(width - headers.length).fill('')] : headers, rows, caption: t.caption ? String(t.caption) : '' };
  });
}

/** LaTeX written with ONE backslash inside a JSON string is silently eaten by JSON itself:
 *  "\frac" becomes form-feed + "rac", "\beta" backspace + "eta", "\times" tab + "imes",
 *  "\rightarrow" carriage-return + "ightarrow". Those control characters never belong in a
 *  paper, so put the backslash back. "\nu" / "\neq" (newline + letters) can't be told apart
 *  from a real line break, so those are only warned about when they sit inside maths. */
const LOST_ESCAPES = [
  [/\f(?=[a-zA-Z])/g, '\\f'],
  [/\x08(?=[a-zA-Z])/g, '\\b'],
  [/\r(?=[a-zA-Z])/g, '\\r'],
  [/\t(?=(?:imes|ext|extbf|extrm|heta|au|an|anh|frac|ilde|o|op|riangle|herefore)(?![a-zA-Z]))/g, '\\t'],
];
function repairLostBackslashes(raw, warnings) {
  let fixed = 0, newline = 0;
  const walk = v => {
    if (typeof v === 'string') {
      let out = v;
      LOST_ESCAPES.forEach(([re, rep]) => { out = out.replace(re, () => { fixed++; return rep; }); });
      const lost = /\n(?:u|eq|abla|ot|eg|leq|geq|ewline|ewcommand)(?![a-zA-Z])/;
      protectMath(out).maths.forEach(m => { if (lost.test(m.tex)) newline++; });
      // "$\nu$" with one backslash is "$" + line break + "u$", which isn't even read as maths
      newline += (out.match(new RegExp('\\$' + lost.source, 'g')) || []).length;
      return out;
    }
    if (Array.isArray(v)) return v.map(walk);
    if (v && typeof v === 'object') return Object.fromEntries(Object.entries(v).map(([k, x]) => [k, walk(x)]));
    return v;
  };
  const out = walk(raw);
  if (fixed) warnings.push(`Repaired ${fixed} LaTeX command${fixed > 1 ? 's' : ''} whose backslash was lost to JSON escaping (e.g. \\frac typed as "\\frac" in the JSON file). In JSON write every backslash twice: "\\\\frac".`);
  if (newline) warnings.push(`${newline} equation${newline > 1 ? 's' : ''} contain a line break where a LaTeX command such as \\nu or \\neq was probably meant. In JSON write "\\\\nu", not "\\nu".`);
  return out;
}

/** Checks a raw paper object and fills in defaults. Throws a readable Error. */
function normalisePaper(raw) {
  if (typeof raw === 'string') {
    try { raw = JSON.parse(raw); }
    catch (e) { throw new Error(`That isn't valid JSON: ${e.message}`); }
  }
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) throw new Error('The paper must be a JSON object with "title" and "questions".');
  if (!Array.isArray(raw.questions) || !raw.questions.length) throw new Error('"questions" must be a non-empty array.');

  const seen = new Set();
  const warnings = [];
  raw = repairLostBackslashes(raw, warnings);
  const questions = raw.questions.map((q, i) => {
    const label = q && q.id != null ? `"${q.id}"` : `#${i + 1}`;
    if (!q || typeof q !== 'object') throw new Error(`Question ${label} is not an object.`);
    if (typeof q.text !== 'string' || !q.text.trim()) throw new Error(`Question ${label} is missing "text".`);
    const marks = Number(q.marks);
    if (!Number.isFinite(marks) || marks < 0) throw new Error(`Question ${label} needs a numeric "marks" value.`);

    let id = String(q.id ?? i + 1).trim() || String(i + 1);
    while (seen.has(id)) id += "'";
    seen.add(id);

    const options = Array.isArray(q.options) && q.options.length ? q.options.map(String) : null;
    let correctOption = null;
    if (options && q.correctOption != null) {
      const c = typeof q.correctOption === 'number' ? q.correctOption : LETTERS.indexOf(String(q.correctOption).trim().toUpperCase());
      if (c >= 0 && c < options.length) correctOption = c;
    }
    const str = v => (v == null ? '' : String(v));
    const qLabel = `Question ${label}`;
    const imgs = q.images != null && q.images !== '' ? q.images : q.image;
    const out = {
      id, marks,
      commandTerm: str(q.commandTerm).trim(),
      criterion: str(q.criterion).replace(/^\s*criterion\s*/i, '').trim().toUpperCase(),
      task: str(q.task).trim(),
      context: str(q.context),
      images: normImages(imgs, q.imageAlt, q.imageCaption, qLabel, warnings),
      tables: normTables(q.tables ?? q.table, qLabel, warnings),
      text: q.text,
      markScheme: str(q.markScheme),
      markSchemeImages: normImages(q.markSchemeImages ?? q.markSchemeImage, q.markSchemeImageAlt, q.markSchemeImageCaption, `${qLabel} mark scheme`, warnings),
      markSchemeTables: normTables(q.markSchemeTables ?? q.markSchemeTable, `${qLabel} mark scheme`, warnings),
      options, correctOption,
    };
    // LaTeX that KaTeX cannot render: warn now rather than surprise a student mid-exam
    const fields = { text: out.text, context: out.context, markScheme: out.markScheme };
    (options || []).forEach((o, k) => { fields[`option ${LETTERS[k]}`] = o; });
    [...out.tables, ...out.markSchemeTables].forEach(t => {
      fields['table'] = [fields['table'], t.caption, ...t.headers, ...t.rows.flat()].filter(Boolean).join('\n');
    });
    Object.entries(fields).forEach(([f, v]) => mathErrors(v).forEach(e => warnings.push(`${qLabel} ${f}: maths could not be rendered: ${e}`)));
    return out;
  });

  const resources = normResources(raw.resources, warnings);
  resources.filter(r => r.kind === 'content').forEach(r => {
    [r.content, ...r.tables.flatMap(t => [t.caption, ...t.headers, ...t.rows.flat()])]
      .forEach(v => mathErrors(v).forEach(e => warnings.push(`Resource "${r.title}": maths could not be rendered: ${e}`)));
  });

  const dm = Number(raw.durationMinutes);
  let boundaries = null;
  if (raw.gradeBoundaries && typeof raw.gradeBoundaries === 'object') {
    boundaries = Object.entries(raw.gradeBoundaries)
      .map(([grade, min]) => ({ grade: String(grade), min: Number(min) }))
      .filter(b => Number.isFinite(b.min))
      .sort((a, b) => b.min - a.min);
    if (!boundaries.length) boundaries = null;
  }
  return {
    title: String(raw.title || 'Untitled paper'),
    subject: raw.subject ? String(raw.subject) : '',
    durationMinutes: Number.isFinite(dm) && dm > 0 ? dm : DEFAULT_DURATION,
    instructions: Array.isArray(raw.instructions) && raw.instructions.length ? raw.instructions.map(String) : null,
    gradeBoundaries: boundaries,
    questions,
    resources,
    warnings,
  };
}

/** Relative image paths used by a paper (to check they were attached). */
function imagePathsIn(p) {
  const paths = new Set();
  const add = src => { if (src && !/^(data:|https?:|blob:)/i.test(src)) paths.add(src); };
  const mdImages = s => [...String(s || '').matchAll(/!\[[^\]]*\]\(\s*<?([^)\s>]+)>?/g)].map(m => m[1]);
  p.questions.forEach(q => {
    [...q.images, ...q.markSchemeImages].forEach(im => add(im.src));
    [q.text, q.context, q.markScheme, ...(q.options || [])].forEach(s => mdImages(s).forEach(add));
  });
  (p.resources || []).forEach(r => {
    if (r.kind === 'file' && !r.userAdded) add(r.src);
    if (r.kind === 'content') { r.images.forEach(im => add(im.src)); mdImages(r.content).forEach(add); }
  });
  return [...paths];
}

const totalMarks = () => paper.questions.reduce((s, q) => s + q.marks, 0);
const criteriaList = () => [...new Set(paper.questions.map(q => q.criterion).filter(Boolean))].sort();

/* ==========================================================================
   4. STATE: SESSION, SETTINGS AND AUTOSAVE
   ========================================================================== */

let paper = null;      // the loaded paper (normalised)
let session = null;    // this attempt: see freshSession()
let settings = { fontScale: 1, theme: 'white', hideTimer: false, calcMode: 'scientific' };
let mathReady = false; // true once MathLive has loaded
let dirty = false;     // unsaved changes waiting for the next autosave

/**
 * Everything about one attempt. The timer is stored as a start timestamp, so
 * time keeps running while the tab is closed and is recalculated on resume.
 */
function freshSession(p, keep = {}) {
  return {
    status: 'setup',            // 'setup' | 'running' | 'timeup' | 'submitted'
    candidate: keep.candidate || '',
    durationMin: p.durationMinutes || DEFAULT_DURATION,
    startedAt: null,            // epoch ms when Start was pressed
    endedAt: null,              // epoch ms when time ran out or the paper was submitted
    answers: {},                // questionId -> text with \( LaTeX \), or the option letter
    flags: {},                  // questionId -> true
    awarded: {},                // questionId -> self-marked score
    highlights: {},             // "qid:zone" -> highlighted HTML
    notepad: '',
    current: 0,                 // question shown in one-question view
    view: 'paged',              // 'paged' | 'all'
    warned: {},                 // minutes -> true once that warning has fired
    banner: null,               // { kind, text } currently shown
    includeMarkScheme: true,    // export option
    savedAt: null,
  };
}

function readJSON(key) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }
  catch { return null; }
}

function saveNow() {
  if (!session) return;
  try {
    session.savedAt = Date.now();
    localStorage.setItem(STORE.session, JSON.stringify(session));
    dirty = false;
    setSaveStatus('saved');
  } catch (e) {
    setSaveStatus('error');
    console.error('Autosave failed', e);
  }
}

function savePaper() {
  try { localStorage.setItem(STORE.paper, JSON.stringify({ ...paper, warnings: undefined })); }
  catch { toast('This paper is too large to keep after a refresh (base64 images?). Attach the image files instead (folder, zip or "Attach images").', 7000); }
}

function saveSettings() {
  try { localStorage.setItem(STORE.settings, JSON.stringify(settings)); } catch { /* not critical */ }
}

function markDirty() {
  dirty = true;
  setSaveStatus('pending');
}

function setSaveStatus(state) {
  const el = $('#save-status');
  el.classList.toggle('err', state === 'error');
  if (state === 'error') el.innerHTML = `${icon('alert')} Not saved: browser storage is full or blocked`;
  else if (state === 'pending') el.textContent = 'Saving…';
  else if (session.status === 'setup') el.textContent = 'Not started';
  else {
    const t = new Date(session.savedAt || Date.now());
    el.textContent = `Saved ${pad(t.getHours())}:${pad(t.getMinutes())}:${pad(t.getSeconds())}`;
  }
}

/** Copies any answer still sitting in an editor into the session (belt and braces before saving). */
function flushEditors() {
  $$('.editor').forEach(ed => { session.answers[ed.dataset.qid] = serializeEditor(ed); });
}

const isLocked = () => session.status !== 'running';
const isAnswered = q => String(session.answers[q.id] || '').trim().length > 0;

/* ==========================================================================
   5. RENDERING
   ========================================================================== */

const main = $('#main');

/** Re-renders the whole screen for the current status. */
function renderAll() {
  document.title = `${paper.title} · PaperSim`;
  document.body.classList.toggle('locked', isLocked());
  document.body.dataset.status = session.status;
  closeAllPanels(session.status === 'setup');
  if (session.status === 'setup') renderCover();
  else renderExam();
  renderHeader();
  renderBanner();
  renderTimer();
}

/* ---------- Resources: periodic table, formula sheets, data booklets ----------
   A paper's "resources" open in a drawer from the tab on the right edge (like the
   resources panel in on-screen exams). Three kinds:
     "periodic-table"                                built in (see PERIODIC_TABLE below)
     {"title": "Formula sheet", "content": "..."}     Markdown + maths, plus optional table(s)/images
     {"title": "Data booklet", "src": "resources/data-booklet.pdf"}   a PDF or image file
   Questions can link to one: [periodic table](#resource:periodic-table). */
const BUILTIN_RESOURCES = { 'periodic-table': 'Periodic table' };
const isPdfSrc = s => /^data:application\/pdf[;,]/i.test(s) || /\.pdf($|[?#])/i.test(s);
const builtinName = s => {
  const k = String(s ?? '').trim().toLowerCase().replace(/[\s_]+/g, '-');
  return k === 'periodic-table' || k === 'periodictable' ? 'periodic-table' : null;
};
const slugify = s => String(s ?? '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);

/** Is this resource file source something we are willing to load? (PDFs and images) */
function safeResourceSrc(src) {
  const s = String(src || '').trim();
  return /^data:application\/pdf[;,]/i.test(s) || safeImageSrc(s);
}

/** "resources" -> [{id, title, kind: builtin|content|file, ...}]. Bad entries are skipped with a warning. */
function normResources(value, warnings) {
  if (value == null || value === '') return [];
  const list = Array.isArray(value) ? value : [value];
  const out = [], ids = new Set();
  list.forEach((r, k) => {
    const label = `Resource ${k + 1}`;
    const o = typeof r === 'string' ? (builtinName(r) ? { builtin: r } : { src: r }) : r;
    if (!o || typeof o !== 'object' || Array.isArray(o)) { warnings.push(`${label} is not a name, a file path or an object, so it was skipped.`); return; }
    const res = { id: '', title: String(o.title ?? '').trim() };
    if (o.builtin != null) {
      const b = builtinName(o.builtin);
      if (!b) { warnings.push(`${label}: there is no built-in resource called "${o.builtin}" (available: ${Object.keys(BUILTIN_RESOURCES).join(', ')}).`); return; }
      Object.assign(res, { kind: 'builtin', builtin: b, title: res.title || BUILTIN_RESOURCES[b] });
    } else if (o.src != null && String(o.src).trim()) {
      const src = String(o.src).trim();
      if (!safeResourceSrc(src)) { warnings.push(`${label}: "${src.slice(0, 50)}" is not a supported file (use a relative path, an https URL, or a data: URI for a PDF or image).`); return; }
      const name = decodeURIComponent(src.split(/[?#]/)[0].split('/').pop() || '').replace(/\.[a-z0-9]+$/i, '').replace(/[-_]+/g, ' ');
      Object.assign(res, {
        kind: 'file', src, fileType: isPdfSrc(src) ? 'pdf' : 'image', alt: String(o.alt ?? ''),
        title: res.title || (/^data:/i.test(src) || !name ? label : name[0].toUpperCase() + name.slice(1)),
      });
      if (o.userAdded) res.userAdded = true;
    } else if (o.content != null || o.table || o.tables || o.image || o.images) {
      Object.assign(res, {
        kind: 'content', content: String(o.content ?? ''), title: res.title || label,
        tables: normTables(o.tables ?? o.table, label, warnings),
        images: normImages(o.images ?? o.image, o.imageAlt, o.imageCaption, label, warnings),
      });
    } else { warnings.push(`${label} needs "builtin", "src" or "content", so it was skipped.`); return; }
    let id = slugify(o.id ?? (res.builtin || res.title)) || `resource-${k + 1}`;
    while (ids.has(id)) id += '-2';
    ids.add(id);
    res.id = id;
    out.push(res);
  });
  return out;
}

/* ---------- Built-in periodic table (IUPAC relative atomic masses to 2 d.p.; (n) = mass number
   of the most stable isotope) ---------- */
const PT_DATA = 'H,Hydrogen,1.01;He,Helium,4.00;Li,Lithium,6.94;Be,Beryllium,9.01;B,Boron,10.81;C,Carbon,12.01;N,Nitrogen,14.01;O,Oxygen,16.00;F,Fluorine,19.00;Ne,Neon,20.18;Na,Sodium,22.99;Mg,Magnesium,24.31;Al,Aluminium,26.98;Si,Silicon,28.09;P,Phosphorus,30.97;S,Sulfur,32.07;Cl,Chlorine,35.45;Ar,Argon,39.95;K,Potassium,39.10;Ca,Calcium,40.08;Sc,Scandium,44.96;Ti,Titanium,47.87;V,Vanadium,50.94;Cr,Chromium,52.00;Mn,Manganese,54.94;Fe,Iron,55.85;Co,Cobalt,58.93;Ni,Nickel,58.69;Cu,Copper,63.55;Zn,Zinc,65.38;Ga,Gallium,69.72;Ge,Germanium,72.63;As,Arsenic,74.92;Se,Selenium,78.97;Br,Bromine,79.90;Kr,Krypton,83.80;Rb,Rubidium,85.47;Sr,Strontium,87.62;Y,Yttrium,88.91;Zr,Zirconium,91.22;Nb,Niobium,92.91;Mo,Molybdenum,95.95;Tc,Technetium,(98);Ru,Ruthenium,101.07;Rh,Rhodium,102.91;Pd,Palladium,106.42;Ag,Silver,107.87;Cd,Cadmium,112.41;In,Indium,114.82;Sn,Tin,118.71;Sb,Antimony,121.76;Te,Tellurium,127.60;I,Iodine,126.90;Xe,Xenon,131.29;Cs,Caesium,132.91;Ba,Barium,137.33;La,Lanthanum,138.91;Ce,Cerium,140.12;Pr,Praseodymium,140.91;Nd,Neodymium,144.24;Pm,Promethium,(145);Sm,Samarium,150.36;Eu,Europium,151.96;Gd,Gadolinium,157.25;Tb,Terbium,158.93;Dy,Dysprosium,162.50;Ho,Holmium,164.93;Er,Erbium,167.26;Tm,Thulium,168.93;Yb,Ytterbium,173.05;Lu,Lutetium,174.97;Hf,Hafnium,178.49;Ta,Tantalum,180.95;W,Tungsten,183.84;Re,Rhenium,186.21;Os,Osmium,190.23;Ir,Iridium,192.22;Pt,Platinum,195.08;Au,Gold,196.97;Hg,Mercury,200.59;Tl,Thallium,204.38;Pb,Lead,207.20;Bi,Bismuth,208.98;Po,Polonium,(209);At,Astatine,(210);Rn,Radon,(222);Fr,Francium,(223);Ra,Radium,(226);Ac,Actinium,(227);Th,Thorium,232.04;Pa,Protactinium,231.04;U,Uranium,238.03;Np,Neptunium,(237);Pu,Plutonium,(244);Am,Americium,(243);Cm,Curium,(247);Bk,Berkelium,(247);Cf,Californium,(251);Es,Einsteinium,(252);Fm,Fermium,(257);Md,Mendelevium,(258);No,Nobelium,(259);Lr,Lawrencium,(266);Rf,Rutherfordium,(267);Db,Dubnium,(268);Sg,Seaborgium,(269);Bh,Bohrium,(270);Hs,Hassium,(269);Mt,Meitnerium,(278);Ds,Darmstadtium,(281);Rg,Roentgenium,(282);Cn,Copernicium,(285);Nh,Nihonium,(286);Fl,Flerovium,(289);Mc,Moscovium,(290);Lv,Livermorium,(293);Ts,Tennessine,(294);Og,Oganesson,(294)';
const PT_CATS = [
  ['alkali', 'Alkali metals', [3, 11, 19, 37, 55, 87]],
  ['alkaline', 'Alkaline earth metals', [4, 12, 20, 38, 56, 88]],
  ['transition', 'Transition metals', [[21, 30], [39, 48], [72, 80], [104, 112]]],
  ['post', 'Other metals', [13, 31, 49, 50, 81, 82, 83, 84, 113, 114, 115, 116]],
  ['metalloid', 'Metalloids', [5, 14, 32, 33, 51, 52]],
  ['nonmetal', 'Non-metals', [1, 6, 7, 8, 15, 16, 34]],
  ['halogen', 'Halogens', [9, 17, 35, 53, 85, 117]],
  ['noble', 'Noble gases', [2, 10, 18, 36, 54, 86, 118]],
  ['lanthanoid', 'Lanthanoids', [[57, 71]]],
  ['actinoid', 'Actinoids', [[89, 103]]],
];
let ptElements = null;
function periodicElements() {
  if (ptElements) return ptElements;
  const cat = {};
  PT_CATS.forEach(([key, , zs]) => zs.forEach(z => {
    if (Array.isArray(z)) for (let n = z[0]; n <= z[1]; n++) cat[n] = key; else cat[z] = key;
  }));
  // Grid position: [row, group]. Rows 1-7 are periods; rows 9-10 are the f-block.
  const pos = z => {
    if (z === 1) return [1, 1];
    if (z === 2) return [1, 18];
    const starts = [[3, 2], [11, 3], [19, 4], [37, 5], [55, 6], [87, 7]];
    let [first, period] = starts[0];
    for (const s of starts) if (z >= s[0]) [first, period] = s;
    const i = z - first;
    if (period <= 3) return [period, i < 2 ? i + 1 : i + 11];
    if (period <= 5) return [period, i + 1];
    if (i < 2) return [period, i + 1];
    if (i < 17) return [period + 3, i + 1];         // La-Lu / Ac-Lr in the f-block rows (groups 3-17)
    return [period, i - 13];                        // Hf/Rf onwards: groups 4-18
  };
  ptElements = PT_DATA.split(';').map((row, k) => {
    const [symbol, name, mass] = row.split(',');
    const z = k + 1;
    const [r, g] = pos(z);
    return { z, symbol, name, mass, cat: cat[z], row: r, group: g };
  });
  return ptElements;
}

function periodicTableHtml() {
  const els = periodicElements();
  const cell = (r, g) => `grid-row:${r + 1};grid-column:${g + 1}`;
  const groups = Array.from({ length: 18 }, (_, i) => `<div class="pt-gn" style="${cell(0, i + 1)}">${i + 1}</div>`).join('');
  const periods = Array.from({ length: 7 }, (_, i) => `<div class="pt-pn" style="${cell(i + 1, 0)}">${i + 1}</div>`).join('');
  const tiles = els.map(e => `<button type="button" class="pt-el pt-${e.cat}" style="${cell(e.row, e.group)}" data-z="${e.z}"
      title="${esc(`${e.name} (${e.symbol}), atomic number ${e.z}, relative atomic mass ${e.mass}`)}"
      aria-label="${esc(`${e.name} (${e.symbol}), atomic number ${e.z}, relative atomic mass ${e.mass}`)}">
      <span class="z">${e.z}</span><span class="s">${e.symbol}</span><span class="m">${e.mass}</span></button>`).join('');
  const gaps = `<div class="pt-el pt-lanthanoid pt-ref" style="${cell(6, 3)}"><span class="s">57–71</span></div>
    <div class="pt-el pt-actinoid pt-ref" style="${cell(7, 3)}"><span class="s">89–103</span></div>`;
  const key = `<div class="pt-key" style="grid-row:2/5;grid-column:4/14">
      <div class="pt-el pt-sample"><span class="z">atomic number</span><span class="s">Symbol</span><span class="m">relative atomic mass</span></div>
      <div class="pt-info" aria-live="polite">Select an element to see its name.</div>
    </div>`;
  const legend = PT_CATS.map(([k, label]) => `<span><i class="pt-${k}"></i>${label}</span>`).join('');
  return `<div class="pt-wrap"><div class="pt">${groups}${periods}${tiles}${gaps}${key}<div class="pt-gap" style="grid-column:1/-1"></div></div></div>
    <div class="pt-legend">${legend}</div>`;
}

/* ---------- The drawer ---------- */
const resUi = { open: false, active: null, wide: false };
const pdfUrls = new Map();   // data:application/pdf URIs -> blob: URLs (browsers block data: PDFs in frames)

function resourceUrl(r) {
  if (/^data:application\/pdf/i.test(r.src)) {
    if (!pdfUrls.has(r.src)) {
      try {
        const [head, body] = r.src.split(',');
        const bytes = /;base64/i.test(head) ? Uint8Array.from(atob(body), c => c.charCodeAt(0)) : new TextEncoder().encode(decodeURIComponent(body));
        pdfUrls.set(r.src, URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' })));
      } catch { return ''; }
    }
    return pdfUrls.get(r.src);
  }
  return resolveImageSrc(r.src);
}

/** Shows or hides the side tab; keeps the drawer in step with the paper and exam state. */
function renderResources() {
  const tab = $('#res-tab');
  if (!tab || !paper || !session) return;
  const list = paper.resources || [];
  const usable = session.status !== 'setup';
  tab.hidden = !usable;
  $('.res-count', tab).textContent = list.length || '';
  $('.res-count', tab).hidden = !list.length;
  $('#btn-res').disabled = !usable;
  if (!usable && resUi.open) toggleResources(false);
  else if (resUi.open) renderResourceDrawer();
}

function toggleResources(force, id) {
  const open = force ?? !resUi.open;
  resUi.open = open;
  if (id) resUi.active = id;
  const drawer = $('#res-drawer');
  drawer.hidden = !open;
  document.body.classList.toggle('res-open', open);
  document.body.classList.toggle('res-wide', open && resUi.wide);
  if (!open) document.body.classList.remove('res-pt');
  $('#res-tab').setAttribute('aria-expanded', String(open));
  $('#btn-res').classList.toggle('on', open);
  if (open) renderResourceDrawer();
}

/** Opens a resource by id, built-in name or title (used by #resource:... links in questions). */
function openResource(key) {
  const list = paper.resources || (paper.resources = []);
  const k = slugify(key);
  let r = list.find(x => x.id === k || x.builtin === builtinName(key) || slugify(x.title) === k);
  if (!r && builtinName(key)) {   // linked from a question but not listed: add the built-in
    r = normResources([{ builtin: key }], [])[0];
    if (list.some(x => x.id === r.id)) r.id += '-2';
    list.push(r);
    savePaper();
  }
  if (!r) { toast(`This paper has no resource called "${key}".`); return; }
  toggleResources(true, r.id);
}

function renderResourceDrawer() {
  const list = paper.resources || [];
  if (!list.some(r => r.id === resUi.active)) resUi.active = list[0]?.id ?? null;
  const tabs = $('#res-drawer .res-tabs');
  tabs.innerHTML = list.map(r => `<button type="button" role="tab" data-res-tab="${esc(r.id)}" aria-selected="${r.id === resUi.active}">${esc(r.title)}</button>`).join('');
  tabs.hidden = list.length < 2;
  $('#res-drawer [data-res="wide"]').classList.toggle('on', resUi.wide);
  const body = $('#res-drawer .res-body');
  const r = list.find(x => x.id === resUi.active);
  document.body.classList.toggle('res-pt', r?.kind === 'builtin');
  if (!r) {
    body.innerHTML = `<div class="res-empty"><p>This paper has no resources.</p>
      <p>Add the built-in periodic table, or a formula sheet or data booklet of your own (PDF or image).</p>
      <div class="res-empty-actions">
        <button class="btn" type="button" data-res="add-pt">${icon('plus')}Periodic table</button>
        <button class="btn" type="button" data-res="add-file">${icon('upload')}PDF or image…</button>
      </div></div>`;
    return;
  }
  const remove = r.userAdded ? `<button class="res-remove" type="button" data-res="remove">Remove</button>` : '';
  if (r.kind === 'builtin') body.innerHTML = periodicTableHtml();
  else if (r.kind === 'content') {
    body.innerHTML = `<div class="rich res-rich">${renderRich(r.content)}${r.tables.map(tableToHtml).join('')}${figuresHtml(r.images, r.title)}</div>`;
    hydrateRich(body);
  } else {
    const url = resourceUrl(r);
    const open = url ? `<a class="res-open-tab" href="${esc(url)}" target="_blank" rel="noopener">${icon('external')}Open in a new tab</a>` : '';
    const missing = !/^(data:|https?:|blob:)/i.test(r.src) && !assetFor(r.src)
      ? `<p class="res-note">If the file does not appear, load the paper again and attach <code>${esc(r.src)}</code> (or drop the whole folder or a zip).</p>` : '';
    body.innerHTML = r.fileType === 'pdf'
      ? `<div class="res-file-bar">${open}${remove}</div>${missing}<iframe class="res-pdf" src="${esc(url)}" title="${esc(r.title)}"></iframe>`
      : `<div class="res-file-bar"><span class="res-hint">Click the image to zoom</span>${open}${remove}</div>${missing}
         <img class="res-img" data-src="${esc(r.src)}" alt="${esc(r.alt || r.title)}">`;
    hydrateRich(body);
    return;
  }
  if (remove) body.insertAdjacentHTML('afterbegin', `<div class="res-file-bar">${remove}</div>`);
}

/** Adds the student's own file (PDF or image) as a resource for this paper. Kept with the attached images. */
function addResourceFiles(files) {
  const list = paper.resources || (paper.resources = []);
  let last = null;
  [...files].forEach(file => {
    if (!/\.(pdf|png|jpe?g|gif|svg|webp|bmp|avif)$/i.test(file.name)) { toast(`"${file.name}" is not a PDF or image.`); return; }
    const path = `resources/${file.name}`;
    assets.set(normAssetPath(path), { name: path, blob: file, url: URL.createObjectURL(file) });
    const r = normResources([{ src: path, userAdded: true }], [])[0];
    while (list.some(x => x.id === r.id)) r.id += '-2';
    list.push(r);
    last = r;
  });
  if (!last) return;
  persistAssets();
  savePaper();
  renderResources();
  toggleResources(true, last.id);
}

function bindResourceEvents() {
  const drawer = $('#res-drawer');
  const fileIn = $('#res-file-in');
  $('#res-tab').addEventListener('click', () => toggleResources());
  fileIn.addEventListener('change', () => { addResourceFiles(fileIn.files); fileIn.value = ''; });
  drawer.addEventListener('click', e => {
    const tab = e.target.closest('[data-res-tab]');
    if (tab) { resUi.active = tab.dataset.resTab; renderResourceDrawer(); return; }
    const el = e.target.closest('.pt-el[data-z]');
    if (el) {
      const x = periodicElements()[el.dataset.z - 1];
      $$('.pt-el.sel', drawer).forEach(n => n.classList.remove('sel'));
      el.classList.add('sel');
      $('.pt-info', drawer).innerHTML = `<strong>${esc(x.name)}</strong> (${esc(x.symbol)}) · atomic number ${x.z} · relative atomic mass ${esc(x.mass)}`;
      return;
    }
    if (e.target.matches('.res-img')) { e.target.classList.toggle('zoom'); return; }
    const act = e.target.closest('[data-res]')?.dataset.res;
    if (act === 'close') toggleResources(false);
    if (act === 'wide') { resUi.wide = !resUi.wide; toggleResources(true); }
    if (act === 'add') $('.res-menu', drawer).hidden = !$('.res-menu', drawer).hidden;
    if (act === 'add-pt') { $('.res-menu', drawer).hidden = true; openResource('periodic-table'); renderResources(); }
    if (act === 'add-file') { $('.res-menu', drawer).hidden = true; fileIn.click(); }
    if (act === 'remove') {
      paper.resources = paper.resources.filter(r => r.id !== resUi.active);
      savePaper();
      renderResources();
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && resUi.open && !modal.open) {
      if (!$('.res-menu', drawer).hidden) $('.res-menu', drawer).hidden = true;
      else toggleResources(false);
    }
  });
  // Links in questions: #resource:<name> opens the drawer; web links open in a new tab, not over the exam
  document.addEventListener('click', e => {
    const a = e.target.closest?.('a[href]');
    if (!a || !a.closest('.rich, #main, #res-drawer') || a.target === '_blank') return;
    const href = a.getAttribute('href');
    const m = href.match(/^#resource[:=/](.+)$/i);
    if (m) { e.preventDefault(); openResource(decodeURIComponent(m[1])); return; }
    if (/^https?:/i.test(href)) { e.preventDefault(); window.open(href, '_blank', 'noopener'); }
  });
}

/* ---------- Header ---------- */
function renderHeader() {
  $('#hdr-title').textContent = paper.title;
  $('#hdr-title').title = paper.title;
  const st = session.status;
  $('#btn-submit').disabled = !(st === 'running' || st === 'timeup');
  $('#btn-submit').lastChild.textContent = st === 'submitted' ? 'Submitted' : 'Submit';
  $('#btn-export').disabled = st === 'setup';
  $('#view-group').hidden = st === 'setup';
  ['#btn-hl', '#btn-notepad', '#btn-calc'].forEach(s => { $(s).disabled = st === 'setup'; });
  renderResources();
  $('#view-paged').classList.toggle('on', session.view === 'paged');
  $('#view-all').classList.toggle('on', session.view === 'all');
  updateProgress();
  setSaveStatus(dirty ? 'pending' : 'saved');
}

function updateProgress() {
  const n = paper.questions.length;
  if (session.status === 'submitted') {
    const t = scoreTotals();
    $('#prog-text').textContent = `Score · ${t.markedCount}/${n} marked`;
    $('#prog-count').textContent = `${fmtNum(t.awarded)} / ${t.max} (${t.pct}%)`;
    $('#prog-fill').style.width = `${t.pct}%`;
  } else {
    const done = paper.questions.filter(isAnswered).length;
    $('#prog-text').textContent = 'Answered';
    $('#prog-count').textContent = `${done} / ${n}`;
    $('#prog-fill').style.width = `${n ? (done / n) * 100 : 0}%`;
  }
}

function defaultInstructions() {

  ];
}

function renderCover() {
  const total = totalMarks();
  const crits = criteriaList();

  const presets = [...new Set([60, 90, 120, paper.durationMinutes, Math.round(paper.durationMinutes * 1.25)])].sort((a, b) => a - b);

/* ---------- Exam view ---------- */
function renderExam() {
  main.innerHTML = `
    <div class="exam view-${session.view}" id="exam">
      <aside class="nav" id="nav" aria-label="Question navigator"></aside>
      <div class="paper" id="paper">
        <div id="results"></div>

/** Builds one question card. */
function buildQuestion(q, i) {
  const hasStim = !!(q.context || q.images.length || q.tables.length);
  const card = document.createElement('article');
  card.className = 'q page' + (hasStim ? ' has-stim' : '') + (session.status === 'submitted' ? ' reviewing' : '');
  card.id = `q-${i}`;
  card.dataset.idx = i;
  card.dataset.qid = q.id;
  card.innerHTML = `
    ${q.task ? `<div class="q-task">${esc(q.task)}</div>` : ''}
    <header class="q-head" ${q.task ? '' : 'style="padding-top:18px"'}>
      <div class="q-id">Question ${esc(q.id)}</div>
      <div class="q-chips">
        ${q.commandTerm ? `<span class="chip term" title="Command term">${esc(q.commandTerm)}</span>` : ''}
        ${q.criterion ? `<span class="chip" title="MYP assessment criterion">Criterion ${esc(q.criterion)}</span>` : ''}
      </div>
      <div class="q-marks">[${fmtNum(q.marks)} mark${q.marks === 1 ? '' : 's'}]</div>
      <button type="button" class="flag-btn" data-act="flag" aria-pressed="${!!session.flags[q.id]}" title="Flag this question to come back to it">${icon('flag')}<span>${session.flags[q.id] ? 'Flagged' : 'Flag'}</span></button>
    </header>
    <div class="q-body">
      ${hasStim ? `
        <section class="q-stim" aria-label="Source material">
          <div class="stim-label">Source</div>
          ${q.context ? `<div class="rich hl-zone" data-hl="${esc(q.id)}:context"></div>` : ''}
          ${q.tables.length ? `<div class="rich hl-zone" data-hl="${esc(q.id)}:tables"></div>` : ''}
          ${q.images.length ? `<div class="q-figs">${figuresHtml(q.images, `Image for question ${q.id}`)}</div>` : ''}
        </section>` : ''}
      <section class="q-main">
        <div class="q-prompt rich hl-zone" data-hl="${esc(q.id)}:text"></div>
        <div class="q-work">
          <div class="answer"></div>
          <aside class="review" aria-label="Mark scheme and marking"></aside>
        </div>
      </section>
    </div>`;

  // Question text and stimulus (with any saved highlights)
  fillRich($('.q-prompt', card), q.text);
  if (q.context) fillRich($(`[data-hl="${CSS.escape(q.id)}:context"]`, card), q.context);
  if (q.tables.length) fillRich($(`[data-hl="${CSS.escape(q.id)}:tables"]`, card), null, q.tables.map(tableToHtml).join(''));
  hydrateRich($('.q-figs', card));

  // Answer area: multiple choice or text + maths editor
  const answer = $('.answer', card);
  if (q.options) answer.appendChild(buildMcq(q, i));
  else answer.append(...buildEditor(q));
  return card;
}

/** Fills a rich-text zone, restoring saved highlights if there are any. `html` overrides `text` (tables). */
function fillRich(el, text, html) {
  const saved = session.highlights[el.dataset.hl];
  el.innerHTML = saved != null
    ? (window.DOMPurify ? DOMPurify.sanitize(saved, { ADD_ATTR: ['data-src'], USE_PROFILES: { html: true, mathMl: true, svg: true } }) : saved)
    : (html ?? renderRich(text));
  hydrateRich(el);
}

function buildMcq(q, i) {
  const fs = document.createElement('fieldset');
  fs.className = 'mcq';
  fs.innerHTML = `<legend class="sr-only">Choose one answer for question ${esc(q.id)}</legend>` +
    q.options.map((o, k) => `
      <label class="opt" data-letter="${LETTERS[k]}">
        <input type="radio" name="mcq-${i}" value="${LETTERS[k]}" ${session.answers[q.id] === LETTERS[k] ? 'checked' : ''}>
        <span class="opt-letter">${LETTERS[k]}</span>
        <span class="opt-text">${renderInline(o)}</span>
      </label>`).join('');
  hydrateRich(fs);
  fs.addEventListener('change', e => {
    if (isLocked()) return;
    session.answers[q.id] = e.target.value;
    updateNavButton(q.id);
    updateProgress();
    markDirty();
  });
  return fs;
}

/* ---------- Navigator ---------- */
function renderNav() {
  const nav = $('#nav');
  let html = '<h2>Questions</h2><div class="nav-groups">';
  let lastTask = null;
  paper.questions.forEach((q, i) => {
    if (q.task !== lastTask) {
      if (lastTask !== null) html += '</div>';

      lastTask = q.task;
    }

      <span>${esc(q.id)}</span><span class="sc"></span><span class="fl">${icon('flag')}</span></button>`;
  });
  html += '</div></div>';
  html += `<div class="nav-legend">
      <span><i class="sw ans"></i>Answered</span>
      <span><i class="sw"></i>Not answered</span>
      <span><i class="sw fl"></i>Flagged for review</span>
    </div>
    <div class="nav-summary" id="nav-summary"></div>`;

/** Updates the answered / flagged / score state of one navigator button. */
function updateNavButton(qid) {
  const btn = $(`.nav-q[data-qid="${CSS.escape(qid)}"]`);
  if (!btn) return;
  const q = paper.questions.find(x => x.id === qid);
  btn.classList.toggle('answered', isAnswered(q));
  btn.classList.toggle('flagged', !!session.flags[qid]);
  const sc = $('.sc', btn);
  btn.classList.remove('full', 'part', 'zero');
  if (session.status === 'submitted') {
    const a = session.awarded[qid];
    sc.textContent = a == null ? `–/${fmtNum(q.marks)}` : `${fmtNum(a)}/${fmtNum(q.marks)}`;
    if (a != null) btn.classList.add(a >= q.marks ? 'full' : a > 0 ? 'part' : 'zero');
  } else sc.textContent = '';
  const flagged = Object.values(session.flags).filter(Boolean).length;
  const sum = $('#nav-summary');
  if (sum) sum.textContent = flagged ? `${plural(flagged, 'question')} flagged` : '';
}

function updateCurrentNav() {
  $$('.nav-q').forEach(b => b.classList.toggle('current', Number(b.dataset.idx) === session.current));
}

/* ---------- One question vs all questions ---------- */
function applyView(scroll = true) {
  const exam = $('#exam');
  if (!exam) return;
  exam.className = `exam view-${session.view}`;
  const cards = $$('.q', exam);
  session.current = Math.min(Math.max(0, session.current), cards.length - 1);
  cards.forEach((c, i) => { c.hidden = session.view === 'paged' && i !== session.current; });
  renderPager();
  updateCurrentNav();
  $('#view-paged').classList.toggle('on', session.view === 'paged');
  $('#view-all').classList.toggle('on', session.view === 'all');
  if (scroll && session.view === 'all') cards[session.current]?.scrollIntoView({ block: 'start' });
}

function renderPager() {
  const pager = $('#pager');
  if (!pager) return;
  const n = paper.questions.length, i = session.current;
  pager.innerHTML = `
    <button type="button" class="btn" data-act="prev" ${i === 0 ? 'disabled' : ''}>${icon('left')}Previous</button>
    <span>Question ${i + 1} of ${n} <span style="opacity:.7">· Alt+← / Alt+→</span></span>
    <button type="button" class="btn ${i < n - 1 ? 'primary' : ''}" data-act="next" ${i >= n - 1 ? 'disabled' : ''}>Next${icon('right')}</button>`;
}

function goTo(i) {
  session.current = Math.min(Math.max(0, i), paper.questions.length - 1);
  if (session.view === 'paged') {
    applyView(false);
    window.scrollTo({ top: 0, behavior: 'instant' });
  } else {
    $(`#q-${session.current}`)?.scrollIntoView({ block: 'start', behavior: 'smooth' });
    updateCurrentNav();
  }
  markDirty();
}

/** In all-questions view, keep the navigator in sync with what's on screen. */
function trackScroll() {
  if (session?.view !== 'all' || !$('#exam')) return;
  const topH = $('#topbar').offsetHeight;
  const cards = $$('.q');
  let best = 0;
  cards.forEach((c, i) => { if (c.getBoundingClientRect().top - topH < 160) best = i; });
  if (best !== session.current) { session.current = best; updateCurrentNav(); }
}

/** Enables or disables every input depending on whether the exam is running. */
function applyLock() {
  const locked = isLocked();
  document.body.classList.toggle('locked', locked);
  $$('.editor').forEach(ed => ed.setAttribute('contenteditable', locked ? 'false' : 'true'));
  $$('.editor math-field').forEach(mf => {
    mf.readOnly = locked;
    mf.toggleAttribute('read-only', locked);
  });
  $$('.mcq input').forEach(inp => { inp.disabled = locked; });
  $$('.ans-tools .btn').forEach(b => { b.disabled = locked; });
  if (locked && window.mathVirtualKeyboard) try { window.mathVirtualKeyboard.hide(); } catch { /* ignore */ }
}

/* ==========================================================================
   6. ANSWER EDITOR: plain text with inline MathLive equations
   --------------------------------------------------------------------------
   Each answer box is a contenteditable <div>. Equations are <math-field>
   elements wrapped in a non-editable <span class="mwrap">. Answers are saved
   as plain text where every equation becomes \( LaTeX \).
   ========================================================================== */

const lastRanges = new WeakMap(); // editor -> last caret position, so toolbar buttons insert in the right place

function buildEditor(q) {
  const tools = document.createElement('div');
  tools.className = 'ans-tools';
  tools.innerHTML = `
    <button type="button" class="btn sm" data-act="eq" title="Insert an equation at the cursor (Ctrl+M)">${icon('sigma')}Insert equation</button>
    <button type="button" class="btn sm" data-act="kbd" title="Show or hide the on-screen maths keyboard">${icon('keyboard')}Maths keyboard</button>
    <span class="hint">${mathReady ? 'In an equation: type \\frac, \\sqrt, \\alpha… · Enter = new line · → to leave it' : 'Maths editor offline: type LaTeX between \\( and \\)'}</span>
    <span class="wc" aria-live="off">0 words</span>`;

  const ed = document.createElement('div');
  ed.className = 'editor';
  ed.dataset.qid = q.id;
  ed.setAttribute('contenteditable', 'true');
  ed.setAttribute('role', 'textbox');
  ed.setAttribute('aria-multiline', 'true');
  ed.setAttribute('aria-label', `Answer to question ${q.id}`);
  ed.setAttribute('spellcheck', 'false'); // like the real exam: no spellchecker
  ed.dataset.placeholder = 'Type your answer here…';
  ed.style.setProperty('--lines', String(Math.min(18, Math.max(4, Math.round(q.marks * 2)))));
  ed.appendChild(buildEditorContent(session.answers[q.id] || ''));

  ed.addEventListener('input', () => onEditorInput(ed));
  ed.addEventListener('keydown', e => onEditorKey(e, ed));
  ed.addEventListener('beforeinput', e => onEditorBeforeInput(e, ed));
  ed.addEventListener('paste', e => {
    e.preventDefault();
    if (isLocked()) return;
    const text = (e.clipboardData || window.clipboardData).getData('text/plain');
    insertNodeAtCaret(ed, buildEditorContent(text));
    onEditorInput(ed);
  });
  ed.addEventListener('drop', e => e.preventDefault()); // no dragging in formatted HTML
  queueMicrotask(() => updateEditorMeta(ed));
  return [tools, ed];
}

/** Text with \( latex \) -> DOM nodes for the editor. */
function buildEditorContent(text) {
  const frag = document.createDocumentFragment();
  const addText = s => s.split('\n').forEach((line, k) => {
    if (k) frag.appendChild(document.createElement('br'));
    if (line) frag.appendChild(document.createTextNode(line));
  });
  String(text || '').split(/(\\\([\s\S]*?\\\))/).forEach(part => {
    const m = part.match(/^\\\(([\s\S]*)\\\)$/);
    if (m && mathReady) {
      if (!frag.lastChild || frag.lastChild.nodeType !== Node.TEXT_NODE) frag.appendChild(document.createTextNode(ZWSP));
      frag.appendChild(makeMathWrap(m[1]));
      frag.appendChild(document.createTextNode(ZWSP));
    } else if (part) addText(part);
  });
  return frag;
}

/** Editor DOM -> text with \( latex \). */
function serializeEditor(ed) {
  let out = '';
  const walk = node => {
    node.childNodes.forEach(child => {
      if (child.nodeType === Node.TEXT_NODE) out += child.nodeValue.replace(/\u200B/g, '');
      else if (child.nodeName === 'BR') out += '\n';
      else if (child.classList?.contains('mwrap')) {
        const mf = child.querySelector('math-field');
        const latex = mf ? String(mf.value ?? '').trim() : '';
        if (latex) out += `\\(${latex}\\)`;
      } else if (/^(DIV|P)$/.test(child.nodeName)) {
        if (out && !out.endsWith('\n')) out += '\n';
        walk(child);
      } else walk(child);
    });
  };
  walk(ed);
  return out.replace(/\s+$/, '');
}

function makeMathWrap(latex) {
  const wrap = document.createElement('span');
  wrap.className = 'mwrap';
  wrap.contentEditable = 'false';
  const mf = new MathfieldElement();
  mf.mathVirtualKeyboardPolicy = 'manual';
  mf.value = latex;
  if (isLocked()) { mf.readOnly = true; mf.setAttribute('read-only', ''); }
  mf.addEventListener('input', () => { const ed = wrap.closest('.editor'); if (ed) onEditorInput(ed); });
  // Enter inside an equation leaves it and starts a new line of text.
  // (In LaTeX mode, e.g. while typing \frac, Enter still confirms the command.)
  mf.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.shiftKey || e.isComposing || isLocked() || mf.mode === 'latex') return;
    e.preventDefault();
    e.stopPropagation();
    newLineAfterEquation(wrap);
  }, { capture: true });
  // Arrow keys at either edge of the equation move the caret back into the text
  mf.addEventListener('move-out', e => {
    e.preventDefault();
    placeCaretBeside(wrap, /forward|downward/.test(e.detail?.direction) ? 'after' : 'before');
  });
  // An equation left empty is removed when you click away from it
  mf.addEventListener('focusout', () => setTimeout(() => {
    if (!wrap.isConnected || isLocked() || document.activeElement === mf || String(mf.value).trim()) return;
    const ed = wrap.closest('.editor');
    wrap.remove();
    if (ed) onEditorInput(ed);
  }, 250));
  wrap.appendChild(mf);
  return wrap;
}

function placeCaretBeside(wrap, side) {
  const ed = wrap.closest('.editor');
  if (!ed) return;
  let node = side === 'after' ? wrap.nextSibling : wrap.previousSibling;
  if (!node || node.nodeType !== Node.TEXT_NODE) {
    node = document.createTextNode(ZWSP);
    side === 'after' ? wrap.after(node) : wrap.before(node);
  }
  ed.focus({ preventScroll: true });
  const r = document.createRange();
  if (side === 'after') r.setStart(node, node.nodeValue.startsWith(ZWSP) ? 1 : 0);
  else r.setStart(node, node.nodeValue.length);
  r.collapse(true);
  const sel = getSelection();
  sel.removeAllRanges();
  sel.addRange(r);
}

/** Moves the caret out of an equation and inserts a line break after it. */
function newLineAfterEquation(wrap) {
  const ed = wrap.closest('.editor');
  if (!ed) return;
  placeCaretBeside(wrap, 'after');
  document.execCommand('insertLineBreak');
  onEditorInput(ed);
}

/** The caret position inside this editor, or the end of the editor if it has none. */
function caretRangeIn(ed) {
  const sel = getSelection();
  if (sel.rangeCount && ed.contains(sel.getRangeAt(0).commonAncestorContainer)) return sel.getRangeAt(0);
  const saved = lastRanges.get(ed);
  if (saved && ed.contains(saved.commonAncestorContainer)) return saved;
  const r = document.createRange();
  r.selectNodeContents(ed);
  r.collapse(false);
  return r;
}

function insertNodeAtCaret(ed, node) {
  const range = caretRangeIn(ed);
  range.deleteContents();
  const last = node.lastChild || node;
  range.insertNode(node);
  const r = document.createRange();
  r.setStartAfter(last);
  r.collapse(true);
  ed.focus({ preventScroll: true });
  getSelection().removeAllRanges();
  getSelection().addRange(r);
}

/** Inserts a new equation at the caret and puts the cursor inside it. */
function insertEquation(ed, { latexMode = false } = {}) {
  if (isLocked()) return null;
  if (!mathReady) {
    insertNodeAtCaret(ed, document.createTextNode('\\(  \\)'));
    onEditorInput(ed);
    return null;
  }
  const range = caretRangeIn(ed);
  range.deleteContents();
  const wrap = makeMathWrap('');
  const after = document.createTextNode(ZWSP);
  range.insertNode(after);   // insertNode puts nodes at the start of the range,
  range.insertNode(wrap);    // so this ends up as: wrap, after
  if (!wrap.previousSibling || wrap.previousSibling.nodeType !== Node.TEXT_NODE) wrap.before(document.createTextNode(ZWSP));
  const mf = wrap.firstChild;
  // MathLive finishes setting up a new equation a moment after it is inserted,
  // so keep trying to focus it for a few frames.
  const focusMf = (tries = 0) => {
    mf.focus();
    if (document.activeElement === mf || tries > 20) {
      // Same command MathLive runs when you type "\" inside an equation
      if (latexMode) { try { mf.executeCommand(['switchMode', 'latex', '', '\\']); } catch { /* older MathLive */ } }
      return;
    }
    requestAnimationFrame(() => focusMf(tries + 1));
  };
  focusMf();
  onEditorInput(ed);
  return mf;
}

function onEditorKey(e, ed) {
  if (isLocked()) return;
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'm') {
    e.preventDefault();
    insertEquation(ed);
  } else if (mod && /^[biu]$/i.test(e.key)) {
    e.preventDefault(); // plain text answers: no bold/italic/underline
  }
}

/** Runs before the browser changes the text, whatever the input method. */
function onEditorBeforeInput(e, ed) {
  if (isLocked() || e.target !== ed) return;
  if (e.inputType === 'insertParagraph') {
    // Enter makes a simple line break (<br>) instead of a new <div>
    e.preventDefault();
    document.execCommand('insertLineBreak');
  } else if (e.inputType === 'insertText' && e.data === '\\' && mathReady) {
    // Typing a backslash starts an equation in LaTeX mode, e.g. \frac
    e.preventDefault();
    insertEquation(ed, { latexMode: true });
  } else if (/^(formatBold|formatItalic|formatUnderline|insertFromDrop)$/.test(e.inputType)) {
    e.preventDefault();
  }
}

function onEditorInput(ed) {
  if (isLocked()) return;
  const qid = ed.dataset.qid;
  session.answers[qid] = serializeEditor(ed);
  updateEditorMeta(ed);
  updateNavButton(qid);
  updateProgress();
  markDirty();
}

function updateEditorMeta(ed) {
  const text = serializeEditor(ed);
  ed.classList.toggle('is-empty', !text.trim() && !ed.querySelector('.mwrap'));
  const wc = ed.previousElementSibling?.querySelector('.wc');
  if (wc) wc.textContent = plural(countWords(text), 'word');
}

/** Toggles MathLive's on-screen keyboard, creating an equation if needed. */
function toggleMathKeyboard(ed) {
  if (!mathReady || isLocked()) { toast('The maths keyboard needs MathLive, which could not be loaded.'); return; }
  const kb = window.mathVirtualKeyboard;
  if (kb.visible) { kb.hide(); return; }
  let mf = ed.querySelector('math-field:focus-within') || [...ed.querySelectorAll('math-field')].pop();
  if (!mf || String(mf.value).trim()) mf = insertEquation(ed);
  requestAnimationFrame(() => { mf?.focus(); kb.show(); });
}

/* ==========================================================================
   7. TIMER AND TIME WARNINGS
   ========================================================================== */

let tickHandle = null;

const endTime = () => session.startedAt + session.durationMin * 60000;
const remainingMs = () => endTime() - Date.now();

function startTicking() {
  clearInterval(tickHandle);
  tick();
  tickHandle = setInterval(tick, 250);
}

function tick() {
  if (session.status === 'running') {
    const rem = remainingMs();
    if (rem <= 0) { timeUp(); return; }
    checkWarnings(rem);
  }
  renderTimer();
}

function renderTimer() {
  const box = $('#timer-box'), t = $('#timer'), label = $('#timer-label');
  const st = session.status;
  box.classList.remove('warn', 'danger', 'done');
  box.classList.toggle('timer-hidden', settings.hideTimer && st === 'running');
  $('#timer-toggle').hidden = st !== 'running';
  $('#timer-toggle').textContent = settings.hideTimer ? 'Show' : 'Hide';
  if (st === 'setup') {
    label.textContent = 'Time allowed';
    t.textContent = fmtClock(session.durationMin * 60000);
  } else if (st === 'running') {
    const rem = remainingMs();
    label.textContent = 'Time remaining';
    t.textContent = settings.hideTimer ? 'Timer hidden' : fmtClock(rem);
    if (rem <= 10 * 60000) box.classList.add('danger');
    else if (rem <= 30 * 60000) box.classList.add('warn');
  } else if (st === 'timeup') {
    label.textContent = 'Time is up';
    t.textContent = '0:00:00';
    box.classList.add('done');
  } else {
    label.textContent = 'Time used';
    t.textContent = fmtClock((session.endedAt || Date.now()) - session.startedAt, false);
    box.classList.add('done');
  }
}

/** Shows the 30- and 10-minute banners once each (only the most urgent if both have passed). */
function checkWarnings(rem) {
  const minsLeft = rem / 60000;
  const due = [...WARNING_MINUTES].sort((a, b) => a - b)
    .find(w => minsLeft <= w && !session.warned[w] && session.durationMin > w);
  if (due == null) return;
  WARNING_MINUTES.filter(w => w >= due).forEach(w => { session.warned[w] = true; });
  setBanner(due <= 10 ? 'danger' : 'warn',
    `${due} minutes remaining. ${due <= 10 ? 'Check your answers and make sure every question has a response.' : 'Plan your time for the remaining questions.'}`);
  markDirty();
}

function timeUp() {
  flushEditors();
  session.status = 'timeup';
  session.endedAt = endTime();
  setBanner('danger', 'Time is up. Your answers have been locked. Submit the paper to see the mark scheme.');
  saveNow();
  closeAllPanels(true);
  applyLock();
  renderHeader();
  renderTimer();
  openModal({
    title: 'Time is up',
    html: `<p>The examination has ended and your answers are locked. You answered <strong>${paper.questions.filter(isAnswered).length} of ${paper.questions.length}</strong> questions.</p>
           <p>Submit the paper to reveal the mark scheme and mark your work.</p>`,
    dismissible: false,
    actions: [
      { label: 'Look over my answers', close: true },
      { label: 'Submit and view mark scheme', kind: 'primary', onClick: () => { closeModal(); submitPaper(); } },
    ],
  });
}

function setBanner(kind, text) {
  session.banner = kind ? { kind, text } : null;
  renderBanner();
}

function renderBanner() {
  const b = $('#banner');
  const data = session.banner;
  b.hidden = !data;
  if (data) {
    b.className = `banner ${data.kind}`;
    $('#banner-text').textContent = data.text;
  }
  measureHeader();
}

/* ==========================================================================
   8. SUBMIT, SELF-MARKING AND RESULTS
   ========================================================================== */

function startExam() {
  const dur = Math.round(Number($('#dur')?.value || session.durationMin));
  if (!(dur >= 1 && dur <= 600)) { toast('Enter a time between 1 and 600 minutes.'); return; }
  session.durationMin = dur;
  session.candidate = ($('#cand')?.value || '').trim();
  session.status = 'running';
  session.startedAt = Date.now();
  session.endedAt = null;
  session.current = 0;
  saveNow();
  renderAll();
  startTicking();
  window.scrollTo({ top: 0 });
}

/** Opens the review summary that comes before submitting. */
function confirmSubmit() {
  flushEditors();
  const qs = paper.questions;
  const unanswered = qs.filter(q => !isAnswered(q));
  const flagged = qs.filter(q => session.flags[q.id]);
  const jump = list => list.length
    ? `<ul class="check-list">${list.map(q => `<li><button type="button" data-jump="${qs.indexOf(q)}">${esc(q.id)}</button></li>`).join('')}</ul>`
    : '<p style="color:#5b6372">None</p>';
  const timeLeft = session.status === 'running' ? fmtClock(remainingMs()) : '0:00:00';
  openModal({
    title: 'Submit your paper?',
    html: `
      <div class="summary-grid">
        <div><b>${qs.length - unanswered.length}/${qs.length}</b><span>Questions answered</span></div>
        <div><b>${flagged.length}</b><span>Flagged for review</span></div>
        <div><b>${timeLeft}</b><span>Time remaining</span></div>
      </div>
      <strong>Not answered</strong>${jump(unanswered)}
      <strong>Flagged</strong>${jump(flagged)}
      <p>After submitting you can't change your answers. The mark scheme will appear beside each question so you can mark your own work.</p>`,
    actions: [
      { label: 'Return to paper', close: true },
      { label: 'Submit paper', kind: 'primary', onClick: () => { closeModal(); submitPaper(); } },
    ],
    onOpen: dlg => $$('[data-jump]', dlg).forEach(b => b.addEventListener('click', () => {
      closeModal();
      goTo(Number(b.dataset.jump));
    })),
  });
}

function submitPaper() {
  if (session.status === 'running') flushEditors();
  session.endedAt = session.status === 'running' ? Math.min(Date.now(), endTime()) : (session.endedAt || endTime());
  session.status = 'submitted';
  // Multiple-choice questions with a known answer are marked automatically (you can still change it)
  paper.questions.forEach(q => {
    if (q.options && q.correctOption != null && session.awarded[q.id] == null) {
      session.awarded[q.id] = session.answers[q.id] === LETTERS[q.correctOption] ? q.marks : 0;
    }
  });
  session.view = 'all';
  setBanner(null);
  clearInterval(tickHandle);
  saveNow();
  renderAll();
  window.scrollTo({ top: 0 });
  toast('Paper submitted. Mark each answer against the mark scheme.');
}

/** Adds the mark scheme and the marks input to a question card. */
function fillReview(q, i) {
  const card = $(`#q-${i}`);
  const box = $('.review', card);
  const a = session.awarded[q.id];
  const pills = q.marks <= 12 && Number.isInteger(q.marks)
    ? `<div class="award-pills" role="group" aria-label="Quick marks">${Array.from({ length: q.marks + 1 }, (_, k) =>
        `<button type="button" data-award="${k}" class="${a === k ? 'on' : ''}">${k}</button>`).join('')}</div>` : '';
  let mcqKey = '';
  if (q.options && q.correctOption != null) {
    const given = session.answers[q.id];
    mcqKey = `<div class="mcq-key">Correct answer: <strong>${LETTERS[q.correctOption]}</strong> · Your answer: <strong>${given ? esc(given) : 'none'}</strong></div>`;
    $$('.opt', card).forEach(o => o.classList.add(o.dataset.letter === LETTERS[q.correctOption] ? 'correct' : 'wrong'));
  }
  box.innerHTML = `
    <div class="ms-box">
      <div class="ms-label">Mark scheme</div>
      ${q.markScheme || q.markSchemeTables.length || q.markSchemeImages.length
        ? `<div class="rich">${renderRich(q.markScheme)}${q.markSchemeTables.map(tableToHtml).join('')}${figuresHtml(q.markSchemeImages, `Mark scheme image for question ${q.id}`)}</div>`
        : '<p class="ms-none">No mark scheme was provided for this question.</p>'}
      ${mcqKey}
    </div>
    <div class="award">
      <div class="award-row">
        <label for="award-${i}">Marks awarded</label>
        <input class="input" id="award-${i}" type="number" min="0" max="${q.marks}" step="0.5" inputmode="decimal" value="${a ?? ''}" placeholder="–">
        <span class="of">/ ${fmtNum(q.marks)}</span>
      </div>
      ${pills}
    </div>`;
  hydrateRich(box);
  const input = $('input', box);
  const setAward = v => {
    if (v === '' || v == null || Number.isNaN(v)) delete session.awarded[q.id];
    else session.awarded[q.id] = Math.min(q.marks, Math.max(0, Math.round(Number(v) * 2) / 2));
    $$('[data-award]', box).forEach(b => b.classList.toggle('on', Number(b.dataset.award) === session.awarded[q.id]));
    updateNavButton(q.id);
    updateProgress();
    renderResults();
    markDirty();
  };
  input.addEventListener('input', () => setAward(input.value === '' ? '' : Number(input.value)));
  input.addEventListener('change', () => { input.value = session.awarded[q.id] ?? ''; });
  $$('[data-award]', box).forEach(b => b.addEventListener('click', () => {
    input.value = b.dataset.award;
    setAward(Number(b.dataset.award));
  }));
}

function scoreTotals() {
  const max = totalMarks();
  let awarded = 0, markedCount = 0;
  const byCrit = {};
  paper.questions.forEach(q => {
    const a = session.awarded[q.id];
    if (a != null) { awarded += a; markedCount++; }
    if (q.criterion) {
      byCrit[q.criterion] ??= { got: 0, max: 0 };
      byCrit[q.criterion].max += q.marks;
      byCrit[q.criterion].got += a || 0;
    }
  });
  const pct = max ? Math.round((awarded / max) * 1000) / 10 : 0;
  let grade = null;
  if (paper.gradeBoundaries) grade = paper.gradeBoundaries.find(b => pct >= b.min)?.grade ?? null;
  return { max, awarded, markedCount, pct, byCrit, grade };
}

function renderResults() {
  const el = $('#results');
  if (!el || session.status !== 'submitted') return;
  const t = scoreTotals();
  const n = paper.questions.length;
  const crits = Object.keys(t.byCrit).sort();
  el.innerHTML = `
    <section class="page results">
      <h2>Results</h2>
      <p class="sub">Mark each answer using the mark scheme beside it. The total updates as you go.</p>
      <div class="res-grid">
        <div>
          <div class="res-score">${fmtNum(t.awarded)}<small> / ${fmtNum(t.max)}</small></div>
          <div class="res-pct">${t.pct}%${t.grade != null ? ` · Grade ${esc(t.grade)}` : ''}</div>
        </div>
        <div>
          <div class="res-facts">
            <span>Marked <b>${t.markedCount} of ${n}</b></span>
            <span>Answered <b>${paper.questions.filter(isAnswered).length} of ${n}</b></span>
            <span>Time used <b>${fmtClock(session.endedAt - session.startedAt, false)}</b> of ${fmtDuration(session.durationMin * 60000)}</span>
          </div>
          ${crits.length ? `
            <table class="crit-table">
              <thead><tr><th>Criterion</th><th>Marks</th><th style="width:45%"></th></tr></thead>
              <tbody>${crits.map(c => {
                const r = t.byCrit[c];
                return `<tr><td>Criterion ${esc(c)}</td><td>${fmtNum(r.got)} / ${fmtNum(r.max)}</td><td><div class="crit-bar"><i style="width:${r.max ? (r.got / r.max) * 100 : 0}%"></i></div></td></tr>`;
              }).join('')}</tbody>
            </table>` : ''}
          ${t.grade != null ? '<p class="grade-note">Grade is indicative only, using the boundaries in the paper file. Real MYP boundaries change every session.</p>' : ''}
        </div>
      </div>
      <div class="res-actions">
        <label><input type="checkbox" id="inc-ms" ${session.includeMarkScheme ? 'checked' : ''}> Include mark scheme in export</label>
        <button type="button" class="btn primary" data-act="export">${icon('printer')}Export / save as PDF</button>
      </div>
    </section>`;
  $('#inc-ms').addEventListener('change', e => { session.includeMarkScheme = e.target.checked; markDirty(); });
}

/* ==========================================================================
   9. EXPORT (print to PDF)

function buildPrintView() {
  if (!paper || !session || session.status === 'setup') return;
  flushEditorsIfRunning();
  const pv = $('#print-view');
  const t = scoreTotals();
  const submitted = session.status === 'submitted';
  const includeMs = submitted && session.includeMarkScheme;
  const date = new Date(session.startedAt || Date.now());
  const crits = Object.keys(t.byCrit).sort();
  pv.innerHTML = `
    <div class="pv">

        <tr><th>Time allowed</th><td>${fmtDuration(session.durationMin * 60000)}</td><th>Time used</th><td>${fmtClock((session.endedAt || Date.now()) - session.startedAt, false)}</td></tr>
        <tr><th>Total</th><td>${submitted ? `<strong>${fmtNum(t.awarded)} / ${fmtNum(t.max)} (${t.pct}%)</strong>` : 'Not yet marked'}</td>
            <th>${t.grade != null ? 'Indicative grade' : 'Questions answered'}</th>

      </table>
      ${submitted && crits.length ? `<div class="pv-crit">${crits.map(c => `Criterion ${esc(c)}: <strong>${fmtNum(t.byCrit[c].got)} / ${fmtNum(t.byCrit[c].max)}</strong>`).join(' &nbsp;·&nbsp; ')}</div>` : ''}
      ${paper.questions.map(q => {
        const a = session.awarded[q.id];
        const ans = session.answers[q.id] || '';
        let answerHtml;
        if (q.options) {
          answerHtml = ans ? `${esc(ans)}. ${renderInline(q.options[LETTERS.indexOf(ans)] ?? '')}` : '';
        } else answerHtml = ans.trim() ? answerToHtml(ans) : '';
        return `
        <section class="pv-q">
          <div class="pv-qhead">
            <span><b>Question ${esc(q.id)}</b>${q.commandTerm ? ` · ${esc(q.commandTerm)}` : ''}${q.criterion ? ` · Criterion ${esc(q.criterion)}` : ''}</span>
            <span class="pv-score">${submitted && a != null ? fmtNum(a) : '–'} / ${fmtNum(q.marks)}</span>
          </div>
          ${q.context || q.images.length || q.tables.length ? `<div class="pv-ctx rich">${renderRich(q.context)}${q.tables.map(tableToHtml).join('')}${figuresHtml(q.images, `Image for question ${q.id}`)}</div>` : ''}
          <div class="pv-prompt rich">${renderRich(q.text)}</div>
          ${q.options ? `<div class="pv-ctx">${q.options.map((o, k) => `${LETTERS[k]}. ${renderInline(o)}`).join('<br>')}</div>` : ''}
          <div class="pv-label">Answer</div>
          <div class="pv-answer">${answerHtml || '<span class="pv-empty">No answer given.</span>'}</div>

        </section>`;
      }).join('')}
      <div class="pv-foot">Generated by PaperSim on ${new Date().toLocaleString()}. Self-marked practice, not an official result.</div>
    </div>`;
  hydrateRich(pv);
}

function flushEditorsIfRunning() { if (session.status === 'running') flushEditors(); }

async function exportPdf() {
  if (session.status === 'setup') return;
  closeModal();
  buildPrintView();
  try { await document.fonts.ready; } catch { /* ignore */ }
  setTimeout(() => window.print(), 150);
}

/* ==========================================================================
   10. TOOLS: highlighter, notepad, calculator, display settings
   ========================================================================== */

/* ---------- Highlighter ---------- */
let highlighterOn = false;

function toggleHighlighter(force) {
  highlighterOn = force ?? !highlighterOn;
  document.body.classList.toggle('hl-on', highlighterOn);
  $('#btn-hl').classList.toggle('on', highlighterOn);
  if (highlighterOn) toast('Highlighter on: select text in a question or source. Click a highlight to remove it.');
}

function highlightSelection() {
  const sel = getSelection();
  if (!sel.rangeCount || sel.isCollapsed) return;
  const range = sel.getRangeAt(0);
  const start = range.startContainer.nodeType === 1 ? range.startContainer : range.startContainer.parentElement;
  const zone = start?.closest('.hl-zone');
  if (!zone || !zone.contains(range.endContainer)) return;
  // Collect the text pieces first, then wrap them (wrapping changes the DOM).
  const pieces = [];
  const walker = document.createTreeWalker(zone, NodeFilter.SHOW_TEXT);
  for (let n = walker.nextNode(); n; n = walker.nextNode()) {
    if (!range.intersectsNode(n) || !n.nodeValue.trim()) continue;
    if (n.parentElement.closest('.katex, .math-err, .ML__latex, mark.hl, math-field')) continue; // don't split rendered maths
    const s = n === range.startContainer ? range.startOffset : 0;
    const e = n === range.endContainer ? range.endOffset : n.nodeValue.length;
    if (e > s) pieces.push([n, s, e]);
  }
  pieces.forEach(([n, s, e]) => {
    n.splitText(e);
    const mid = n.splitText(s);
    const mark = document.createElement('mark');
    mark.className = 'hl';
    mid.replaceWith(mark);
    mark.appendChild(mid);
  });
  sel.removeAllRanges();
  if (pieces.length) saveHighlights(zone);
}

function removeHighlight(mark) {
  const zone = mark.closest('.hl-zone');
  mark.replaceWith(...mark.childNodes);
  zone.normalize();
  saveHighlights(zone);
}

function saveHighlights(zone) {
  session.highlights[zone.dataset.hl] = zone.querySelector('mark.hl') ? zone.innerHTML : undefined;
  if (session.highlights[zone.dataset.hl] === undefined) delete session.highlights[zone.dataset.hl];
  markDirty();
}

function clearAllHighlights() {
  session.highlights = {};
  markDirty();
  if (session.status !== 'setup') renderExam();
  toast('Highlights cleared.');
}

/* ---------- Floating panels (shared) ---------- */
const panels = {};

function togglePanel(id, title, buildBody, pos = {}) {
  const existing = panels[id];
  if (existing) {
    // keepAlive panels (the calculator) are hidden, not destroyed, so their state survives
    if (pos.keepAlive && existing.hidden) showPanel(id);
    else if (pos.keepAlive) hidePanel(id);
    else closePanel(id);
    return;
  }
  const p = document.createElement('section');
  p.className = 'panel';
  p.id = `panel-${id}`;
  p.setAttribute('role', 'dialog');
  p.setAttribute('aria-label', title);
  p.innerHTML = `<div class="panel-head"><span class="grow">${esc(title)}</span><span class="extra"></span>
    <button type="button" aria-label="Close ${esc(title)}">${icon('x')}</button></div><div class="panel-body"></div>`;
  document.body.appendChild(p);
  const top = ($('#topbar').offsetHeight || $('.bar-main').offsetHeight) + 12;
  p.style.left = `${Math.max(12, innerWidth - p.offsetWidth - 24 - (pos.offsetX || 0))}px`;
  p.style.top = `${top + (pos.offsetY || 0)}px`;
  $('.panel-head > button', p).addEventListener('click', () => (pos.keepAlive ? hidePanel(id) : closePanel(id)));
  makeDraggable(p, $('.panel-head', p));
  panels[id] = p;
  buildBody($('.panel-body', p), $('.panel-head .extra', p));
  $(`[data-act="tool-${id}"]`)?.classList.add('on');
}

function hidePanel(id) {
  if (!panels[id]) return;
  panels[id].hidden = true;
  $(`[data-act="tool-${id}"]`)?.classList.remove('on');
}

function showPanel(id) {
  if (!panels[id]) return;
  panels[id].hidden = false;
  $(`[data-act="tool-${id}"]`)?.classList.add('on');
}

function closePanel(id) {
  panels[id]?.remove();
  delete panels[id];
  $(`[data-act="tool-${id}"]`)?.classList.remove('on');
}

function closeAllPanels(includeTools) {
  if (!includeTools) return;
  ['notepad', 'calc'].forEach(closePanel);
  if (highlighterOn) toggleHighlighter(false);
}

function makeDraggable(el, handle) {
  handle.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    const sx = e.clientX - el.offsetLeft, sy = e.clientY - el.offsetTop;
    handle.setPointerCapture(e.pointerId);
    el.classList.add('dragging');
    const move = ev => {
      el.style.left = `${Math.min(innerWidth - 60, Math.max(0, ev.clientX - sx))}px`;
      el.style.top = `${Math.min(innerHeight - 40, Math.max(0, ev.clientY - sy))}px`;
    };
    const up = () => {
      el.classList.remove('dragging');
      handle.removeEventListener('pointermove', move);
      handle.removeEventListener('pointerup', up);
    };
    handle.addEventListener('pointermove', move);
    handle.addEventListener('pointerup', up);
  });
}

/* ---------- Notepad ---------- */
function toggleNotepad() {
  togglePanel('notepad', 'Notepad', body => {
    body.innerHTML = `<textarea class="notepad-ta" placeholder="Rough work and planning…" spellcheck="false"></textarea>
      <div class="panel-foot">Notes are saved but not marked or exported.</div>`;
    const ta = $('textarea', body);
    ta.value = session.notepad || '';
    ta.readOnly = session.status === 'submitted';
    ta.addEventListener('input', () => { session.notepad = ta.value; markDirty(); });
    ta.focus();

const DESMOS = {
  scientific: { url: 'https://www.desmos.com/scientific', label: 'Scientific', size: [420, 560] },
  graphing: { url: 'https://www.desmos.com/calculator', label: 'Graphing', size: [760, 560] },

function toggleCalculator() {
  togglePanel('calc', 'Calculator', (body, extra) => {
    const panel = body.closest('.panel');
    extra.innerHTML = `<div class="calc-tabs" role="tablist">${Object.entries(DESMOS).map(([k, d]) =>
      `<button type="button" role="tab" data-mode="${k}">${d.label}</button>`).join('')}</div>`;
    const frames = {};
    const show = mode => {
      settings.calcMode = mode;
      saveSettings();
      $$('[data-mode]', extra).forEach(b => b.setAttribute('aria-selected', String(b.dataset.mode === mode)));
      if (!frames[mode]) {
        const f = document.createElement('iframe');
        f.className = 'desmos-frame';
        f.title = `Desmos ${DESMOS[mode].label} Calculator`;
        f.src = DESMOS[mode].url;
        body.appendChild(f);
        frames[mode] = f;
      }
      Object.entries(frames).forEach(([m, f]) => { f.hidden = m !== mode; });
      // Graphing needs more room: grow the panel (it stays resizable from the corner)
      const [w, h] = DESMOS[mode].size;
      const width = Math.min(w, innerWidth - 24);
      if (panel.offsetWidth < width) {
        panel.style.width = `${width}px`;
        panel.style.left = `${Math.max(12, Math.min(panel.offsetLeft, innerWidth - width - 12))}px`;
      }
      if (panel.offsetHeight < h) panel.style.height = `${Math.min(h, innerHeight - 24)}px`;
    };
    $$('[data-mode]', extra).forEach(b => b.addEventListener('click', () => show(b.dataset.mode)));
    if (!navigator.onLine) {
      body.insertAdjacentHTML('afterbegin', '<p class="calc-offline">You seem to be offline. Desmos needs an internet connection.</p>');
    }
    show(DESMOS[settings.calcMode] ? settings.calcMode : 'scientific');
  }, { offsetY: 40, offsetX: 20, keepAlive: true });
}

/**
 * openModal({ title, html, actions: [{label, kind, close, onClick}], wide, dismissible, onOpen })

function openModal({ title, html, actions = [], wide = false, dismissible = true, onOpen }) {
