/* ---------- Attached images: kept in IndexedDB so they survive a refresh ----------
   localStorage is far too small for images, so files attached with a paper are
   stored as Blobs in IndexedDB and turned back into object URLs on start-up. */
const ASSET_DB = { name: 'papersim', store: 'assets', key: 'current' };

function assetDb() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error('IndexedDB not available')); return; }
    const req = indexedDB.open(ASSET_DB.name, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(ASSET_DB.store);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function persistAssets() {
  try {
    const db = await assetDb();
    const list = [...assets.entries()].map(([path, a]) => ({ path, name: a.name, blob: a.blob }));
    await new Promise((res, rej) => {
      const tx = db.transaction(ASSET_DB.store, 'readwrite');
      tx.objectStore(ASSET_DB.store).put(list, ASSET_DB.key);
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  } catch (e) { console.warn('Could not keep the attached images for next time', e); }
}

async function restoreAssets() {
  try {
    const db = await assetDb();
    const list = await new Promise((res, rej) => {
      const req = db.transaction(ASSET_DB.store).objectStore(ASSET_DB.store).get(ASSET_DB.key);
      req.onsuccess = () => res(req.result || []); req.onerror = () => rej(req.error);
    });
    list.forEach(a => assets.set(a.path, { name: a.name, blob: a.blob, url: URL.createObjectURL(a.blob) }));
  } catch (e) { console.warn('No stored images', e); }
}

/** Replaces the attached images with a new set of {path, file} entries. */
function setAssets(files) {
  assets.forEach(a => URL.revokeObjectURL(a.url));
  assets.clear();
  files.forEach(({ path, file }) => assets.set(normAssetPath(path), { name: path, blob: file, url: URL.createObjectURL(file) }));
}

/** Everything dropped/chosen -> {path, file} list, walking into folders. */
async function collectDropped(dataTransfer) {
  const out = [];
  const walk = async (entry, prefix) => {
    if (!entry) return;
    if (entry.isFile) {
      const file = await new Promise((res, rej) => entry.file(res, rej));
      out.push({ path: prefix + file.name, file });
    } else if (entry.isDirectory) {
      const reader = entry.createReader();
      let batch;
      do {
        batch = await new Promise((res, rej) => reader.readEntries(res, rej));
        for (const e of batch) await walk(e, `${prefix}${entry.name}/`);
      } while (batch.length);
    }
  };
  const items = [...(dataTransfer.items || [])].map(it => it.webkitGetAsEntry?.()).filter(Boolean);
  if (items.length) for (const e of items) await walk(e, '');
  else [...dataTransfer.files].forEach(file => out.push({ path: file.name, file }));
  return out;
}

/** A dropped folder "paper/" holding "paper/images/x.png": paths relative to the JSON's folder. */
function relativeTo(jsonPath, path) {
  const dir = jsonPath.includes('/') ? jsonPath.slice(0, jsonPath.lastIndexOf('/') + 1) : '';
  return dir && path.startsWith(dir) ? path.slice(dir.length) : path;
}

/** Unpacks a .zip into {path, file} entries (JSON and images). */
async function unzip(file) {
  if (!window.JSZip) throw new Error('Zip support could not load (offline?). Unzip the file and drop the folder instead.');
  const zip = await JSZip.loadAsync(file);
  const out = [];
  for (const entry of Object.values(zip.files)) {
    if (entry.dir || /(^|\/)(__MACOSX|\.)/.test(entry.name)) continue;
    const ext = entry.name.split('.').pop().toLowerCase();
    if (ext === 'json') out.push({ path: entry.name, file: new File([await entry.async('string')], entry.name, { type: 'application/json' }) });
    else if (ASSET_EXT.test(entry.name)) out.push({ path: entry.name, file: new File([await entry.async('blob')], entry.name.split('/').pop(), { type: IMAGE_MIME[ext] || '' }) });
  }
  return out;
}

/* ---------- Load paper dialog ---------- */
function openLoadDialog() {
  const inProgress = session.status === 'running' || session.status === 'timeup';
  // What the user has given us so far in this dialog
  const pending = { json: null, jsonName: '', images: [] };

  const summary = () => {
    const el = $('#load-files');
    if (!el) return;
    const imgs = pending.images.length ? `${plural(pending.images.length, 'file')} attached: ${pending.images.slice(0, 6).map(i => esc(i.path)).join(', ')}${pending.images.length > 6 ? '…' : ''}` : 'No images or PDFs attached.';
    el.innerHTML = `${pending.jsonName ? `Paper: <strong>${esc(pending.jsonName)}</strong> · ` : ''}${imgs}`;
    el.hidden = !pending.jsonName && !pending.images.length;
  };

  const takeFiles = async entries => {
    try {
      let list = [];
      for (const e of entries) {
        if (/\.zip$/i.test(e.path)) list.push(...(await unzip(e.file)));
        else list.push(e);
      }
      const jsons = list.filter(e => /\.json$/i.test(e.path));
      if (jsons.length) {
        // Several JSON files (e.g. a folder): use the first one that looks like a paper
        let chosen = jsons[0], text = await jsons[0].file.text();
        for (const j of jsons.slice(1)) {
          if (/"questions"\s*:/.test(text)) break;
          const t = await j.file.text();
          if (/"questions"\s*:/.test(t)) { chosen = j; text = t; }
        }
        pending.json = text;
        pending.jsonName = chosen.path;
        // Image paths in the JSON are relative to the JSON file's own folder
        list = list.map(e => ({ ...e, path: relativeTo(chosen.path, e.path) }));
      }
      const imgs = list.filter(e => ASSET_EXT.test(e.path));
      if (imgs.length) {
        const byPath = new Map(pending.images.map(i => [normAssetPath(i.path), i]));
        imgs.forEach(i => byPath.set(normAssetPath(i.path), i));
        pending.images = [...byPath.values()];
      }
      $('#load-err').hidden = true;
      summary();
      // A paper file on its own (no images) loads straight away, as before
      if (pending.json != null && !imgs.length && !pending.images.length && jsons.length) loadPending();
    } catch (e) { showLoadError(e.message || 'Could not read those files.'); }
  };

  const loadPending = () => {
    const raw = pending.json ?? $('#paste').value;

        <label class="btn"><input type="file" id="file-in" accept=".json,application/json,.zip,application/zip" hidden>${icon('upload')}Paper or zip…</label>
        <label class="btn"><input type="file" id="dir-in" webkitdirectory multiple hidden>${icon('upload')}Folder…</label>
        <label class="btn"><input type="file" id="img-in" accept="image/*,.svg,.pdf,application/pdf" multiple hidden>${icon('upload')}Attach images / PDFs…</label>
        <p class="fmt-note" id="load-files" hidden></p>
      </div>
      <div class="or">or paste JSON</div>
      <textarea class="json-in" id="paste" spellcheck="false" placeholder='{ "title": "…", "durationMinutes": 120, "questions": [ … ] }'></textarea>
      <div class="err" id="load-err" hidden></div>
      <details class="fmt"><summary>JSON format (equations, images, tables)</summary><pre>${esc(`{
  "title": "Chemistry Practice",
  "durationMinutes": 60,
  "questions": [
    {
      "id": "1a", "marks": 2, "commandTerm": "Write",
      "context": "Hydrogen burns in oxygen.",
      "text": "Write the balanced equation: $\\\\ce{2H2 + O2 -> 2H2O}$",
      "images": [{"src": "images/apparatus.png", "alt": "...", "caption": "Figure 1"}],
      "table": {"headers": ["t / s", "$v$ / m s$^{-1}$"], "rows": [["0", "0.0"], ["2", "4.1"]], "caption": "Table 1"},
      "markScheme": "$$\\\\ce{CH3COOH <=> CH3COO- + H+}$$\\n| Answer | Mark |\\n|---|---|\\n| ... | [1] |"
    }
  ]
}
Maths: $...$ inline, $$...$$ block. Chemistry: $\\\\ce{...}$. In JSON every backslash is doubled.
Images: relative path, https URL or data:image URI. Attach the files with the buttons above.
Tables: Markdown (| a | b | then |---|---|) or "table": {"headers", "rows", "caption"}.

  {"title": "Formula sheet", "content": "..."}, {"title": "Data booklet", "src": "resources/booklet.pdf"}]
Full guide: PAPER-FORMAT.md next to index.html.`)}</pre></details>`,
    actions: [
      { label: 'Use built-in sample', spacer: true, onClick: () => tryLoadPaper(SAMPLE_PAPER) },
      { label: 'Cancel', close: true },
      { label: 'Load paper', kind: 'primary', onClick: loadPending },
    ],
    onOpen: dlg => {
      const fromInput = input => [...input.files].map(file => ({ path: file.webkitRelativePath || file.name, file }));
      $('#file-in', dlg).addEventListener('change', e => takeFiles(fromInput(e.target)));
      $('#dir-in', dlg).addEventListener('change', e => takeFiles(fromInput(e.target)));
      $('#img-in', dlg).addEventListener('change', e => takeFiles(fromInput(e.target)));

function showLoadError(msg) {
  const el = $('#load-err');
  if (!el) { toast(msg, 5000); return; }
  el.textContent = msg;
  el.hidden = false;
}

/**
 * Loads a paper (JSON text or object) with the images attached in the load dialog.
 * images: [{path, file}] or undefined to keep the images already attached.
 */
function tryLoadPaper(raw, images) {
  if (raw == null || (typeof raw === 'string' && !raw.trim())) { showLoadError('Choose a paper file, drop a folder or zip, or paste the JSON first.'); return; }
  let p;
  try { p = normalisePaper(raw); }
  catch (e) { showLoadError(e.message); return; }
  if (images && images.length) { setAssets(images); persistAssets(); }
  else if (images) { setAssets([]); persistAssets(); }
  closeModal();
  setPaper(p);
  const missing = imagePathsIn(p).filter(src => !assetFor(src));
  const notes = [...p.warnings];
  if (missing.length) {
    notes.unshift(`${plural(missing.length, 'file')} not attached: ${missing.slice(0, 8).join(', ')}${missing.length > 8 ? '…' : ''}. `
      + 'They will still load if they sit next to index.html at that path; otherwise use "Load paper" and attach them (or drop the whole folder or a zip).');
  }
  const summaryText = `Loaded "${p.title}" (${plural(p.questions.length, 'question')}, ${fmtNum(p.questions.reduce((s, q) => s + q.marks, 0))} marks${assets.size ? `, ${plural(assets.size, 'file')} attached` : ''}${p.resources.length ? `, ${plural(p.resources.length, 'resource')}` : ''}).`;
  if (notes.length) {
    openModal({
      title: 'Paper loaded, with warnings',
      html: `<p>${esc(summaryText)}</p><p>Please check these before sitting the paper:</p><ul>${notes.slice(0, 20).map(n => `<li>${esc(n)}</li>`).join('')}</ul>${notes.length > 20 ? `<p>…and ${notes.length - 20} more.</p>` : ''}`,
      actions: [{ label: 'OK', kind: 'primary', close: true }],
    });
  } else toast(summaryText);
}

function setPaper(p) {
  clearInterval(tickHandle);
  paper = p;
  resUi.active = null;
  savePaper();
  session = freshSession(p, { candidate: session?.candidate });
  saveNow();
  renderAll();
  startTicking();
  window.scrollTo({ top: 0 });
}

   12. EVENT WIRING AND START-UP
   ========================================================================== */

function measureHeader() {
  // On phones #topbar is "display: contents" and only .bar-main is sticky
  const h = $('#topbar').offsetHeight || $('.bar-main').offsetHeight;
  document.documentElement.style.setProperty('--top-h', `${h}px`);
}

function bindGlobalEvents() {
  bindResourceEvents();
  // Every button with data-act is handled here
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const act = el.dataset.act;
    const card = el.closest('.q');
    switch (act) {
      case 'start': startExam(); break;
      case 'load': openLoadDialog(); break;
      case 'reset': confirmReset(); break;
      case 'submit': confirmSubmit(); break;
      case 'export': exportPdf(); break;
      case 'view':
        session.view = el.dataset.view; applyView(); markDirty(); break;
      case 'goto': goTo(Number(el.dataset.idx)); break;
      case 'prev': goTo(session.current - 1); break;
      case 'next': goTo(session.current + 1); break;
      case 'flag': {
        const qid = card.dataset.qid;
        session.flags[qid] = !session.flags[qid];
        if (!session.flags[qid]) delete session.flags[qid];
        el.setAttribute('aria-pressed', String(!!session.flags[qid]));
        el.lastChild.textContent = session.flags[qid] ? 'Flagged' : 'Flag';
        updateNavButton(qid);
        markDirty();
        break;
      }
      case 'eq': insertEquation($('.editor', card)); break;
      case 'kbd': toggleMathKeyboard($('.editor', card)); break;
      case 'tool-highlight': toggleHighlighter(); break;
      case 'tool-notepad': toggleNotepad(); break;
      case 'tool-resources': toggleResources(); break;
      case 'tool-calc': toggleCalculator(); break;
      case 'tool-display': openDisplaySettings(); break;
      case 'dismiss-banner': setBanner(null); markDirty(); break;
    }
  });

  // Keep the caret where it was when a toolbar button is pressed
  document.addEventListener('mousedown', e => {
    if (e.target.closest('.ans-tools button')) e.preventDefault();
  });

  document.addEventListener('selectionchange', () => {
    const sel = getSelection();
    if (!sel.rangeCount) return;
    const r = sel.getRangeAt(0);
    const node = r.startContainer.nodeType === 1 ? r.startContainer : r.startContainer.parentElement;
    const ed = node?.closest?.('.editor');
    if (ed) lastRanges.set(ed, r.cloneRange());
  });

  // Highlighter
  document.addEventListener('mouseup', e => {
    if (!highlighterOn) return;
    const mark = e.target.closest?.('mark.hl');
    if (mark && getSelection().isCollapsed) { removeHighlight(mark); return; }
    if (e.target.closest?.('.hl-zone')) highlightSelection();
  });

  $('#timer-toggle').addEventListener('click', () => {
    settings.hideTimer = !settings.hideTimer;
    saveSettings();
    renderTimer();
  });

  // Keyboard: Alt+←/→ to move between questions
  document.addEventListener('keydown', e => {
    if (!e.altKey || session.status === 'setup' || modal.open) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(session.current + 1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(session.current - 1); }
  });

  let scrollQueued = false;
  addEventListener('scroll', () => {
    if (scrollQueued) return;
    scrollQueued = true;
    requestAnimationFrame(() => { scrollQueued = false; trackScroll(); });
  }, { passive: true });

  new ResizeObserver(measureHeader).observe($('.bar-main'));
  addEventListener('resize', measureHeader);

  // Autosave: every few seconds, and immediately when the tab is hidden or closed
  setInterval(() => { if (dirty) saveNow(); }, AUTOSAVE_MS);
  const flushAndSave = () => { if (session.status === 'running') flushEditors(); saveNow(); };
  addEventListener('pagehide', flushAndSave);
  document.addEventListener('visibilitychange', () => { if (document.hidden) flushAndSave(); });

  // Ctrl/Cmd+P also produces the clean export
  addEventListener('beforeprint', buildPrintView);
}

async function init() {
  mathReady = !window.__mathliveFailed && !!window.MathLive && !!customElements.get('math-field');
  // Images attached with the current paper (kept in IndexedDB). Never wait more than 1.5 s for them.
  await Promise.race([restoreAssets(), new Promise(r => setTimeout(r, 1500))]);
  if (mathReady) {
    try { MathfieldElement.soundsDirectory = null; } catch { /* older versions */ }
  }

  const storedSettings = readJSON(STORE.settings);
  if (storedSettings) Object.assign(settings, storedSettings);
  applySettings();
  hydrateIcons(document);

  // Restore the paper and the attempt, if any
  let storedPaper = readJSON(STORE.paper);
  try { paper = storedPaper ? normalisePaper(storedPaper) : normalisePaper(SAMPLE_PAPER); }
  catch { paper = normalisePaper(SAMPLE_PAPER); }
  const storedSession = readJSON(STORE.session);
  session = storedSession ? Object.assign(freshSession(paper), storedSession) : freshSession(paper);

  bindGlobalEvents();
  renderAll();
  startTicking(); // if time ran out while the tab was closed, this locks the paper immediately

  if (!richReady()) {
    setTimeout(() => toast('The formatting libraries (KaTeX, Markdown) could not load, probably because you are offline. Equations and tables use simple formatting until you reconnect.', 8000), 400);
  } else if (!mathReady) {
    setTimeout(() => toast('The maths editor (MathLive) could not load, probably because you are offline. Equations will show as LaTeX text.', 7000), 400);
  } else if (session.status === 'running' && storedSession?.savedAt) {
    const away = Date.now() - storedSession.savedAt;
    toast(`Welcome back. Your answers were restored${away > 5000 ? ` and the timer kept running while you were away (${fmtDuration(away)})` : ''}.`, 5000);
  }
}

// MathLive is loaded with "defer", so it is ready by DOMContentLoaded.
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
