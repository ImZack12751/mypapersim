<!DOCTYPE html>
<!--
  ============================================================================
  PaperSim: a timed practice-exam simulator in the style of an MYP on-screen
  examination (eAssessment / AssessPrep-like layout).

  - One file, no build step, no backend. Open it by double-clicking.
  - Everything is stored in your browser's localStorage.
  - Network dependencies (jsDelivr, pinned + integrity hashes): MathLive (answer
    editor), KaTeX + mhchem (maths/chemistry), marked (Markdown + tables),
    DOMPurify (sanitising), JSZip (zip upload). Without them the app still works
    with simple formatting; equations then appear as raw LaTeX.
  - Images attached with a paper are kept in IndexedDB; everything else in localStorage.

  FILE MAP (search for the "==" banners in the <script>)
    1. Constants and the built-in sample paper
    2. Small utilities (escaping, formatting, icons)
   2b. Rich content: Markdown, KaTeX maths/chemistry, tables, images
    3. Paper loading and validation
    4. State: session, settings and autosave
    5. Rendering: header, cover page, exam view, navigator
    6. Answer editor: text + inline MathLive equations
    7. Timer and time warnings
    8. Submit, self-marking and results
    9. Export (print to PDF)
   10. Tools: highlighter, notepad, calculator, display settings
   11. Modals, toasts, floating panels
   12. Event wiring and start-up

  PAPER JSON FORMAT (only "questions[].text" and "questions[].marks" are required)
  Full guide with examples: PAPER-FORMAT.md. Machine-readable: paper.schema.json.
  {
    "title": "Physics Criteria A Practice",
    "subject": "Sciences",                 // optional, shown on the cover
    "durationMinutes": 120,                // optional, default 120
    "instructions": ["...", "..."],        // optional, replaces the default list
    "gradeBoundaries": {"1":0,"2":10, ... "7":78},  // optional, % minimum per grade
    "resources": [                         // optional: opened from the Resources tab on the right
      "periodic-table",                    // built in
      {"title": "Formula sheet", "content": "Markdown + $maths$", "table": {...}},
      {"title": "Data booklet", "src": "resources/data-booklet.pdf"}   // PDF or image file
    ],
    "questions": [
      {
        "id": "1a",                        // optional, defaults to 1, 2, 3...
        "marks": 3,
        "commandTerm": "Explain",
        "criterion": "A",                  // optional MYP criterion (A-D)
        "task": "Task 1: Forces",          // optional heading used to group questions
        "context": "optional stimulus text (Markdown + maths)",
        "image": "images/fig1.png",        // optional: relative path, https URL or data:image URI
        "imageAlt": "...", "imageCaption": "Figure 1",
        "images": [{"src": "...", "alt": "...", "caption": "...", "width": "60%"}],  // several images
        "table": {"headers": ["..."], "rows": [["..."]], "caption": "Table 1"},   // or "tables": [...]
        "text": "the question",
        "options": ["...", "..."],         // optional: makes it multiple choice
        "correctOption": "B",              // optional: auto-marks multiple choice
        "markScheme": "model answer / marking points",
        "markSchemeImages": [...], "markSchemeTable": {...}   // optional
      }
    ]
  }
  Text fields are Markdown: **bold**, *italic*, "- " bullets, GitHub tables
  (| a | b | then |---|---|) and ![alt](images/x.png). Maths: $...$ inline,
  $$...$$ block (also \( \) and \[ \]); chemistry with $\ce{2H2 + O2 -> 2H2O}$.
  Inside JSON every backslash is doubled: "$\\frac{1}{2}$", "$\\ce{H2O}$".
  A question can link to a resource: [periodic table](#resource:periodic-table).
  ============================================================================
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaperSim</title>

<!-- MathLive: maths editor (math-field) and the stylesheets for rendered maths.
     Pinned to a known version so the app does not change underneath you. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mathlive@0.110.0/mathlive-fonts.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mathlive@0.110.0/mathlive-static.css">
<script defer src="https://cdn.jsdelivr.net/npm/mathlive@0.110.0/mathlive.min.js"
        onerror="window.__mathliveFailed = true"></script>

<!-- Rich content in papers (questions, sources, mark schemes, print view):
     KaTeX + mhchem   maths and chemistry: $...$, $$...$$, \(...\), \[...\], \ce{...}
     marked           Markdown with GitHub tables (GFM)
     DOMPurify        sanitises the HTML, because papers are loaded from files
     JSZip            loading a paper + its images from a .zip
     Pinned versions with integrity hashes. If they cannot load (offline), papers still
     open and fall back to the simple built-in formatter. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.css"
      integrity="sha384-3rdsX6e5mueWyoweR9NIVmtEsUkokpBT/0ALqKKIBMr9j4qhHkaIkAcGgsE6uVlp" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.js"
        integrity="sha384-QFFtAGzvvj+bfgCGxXJlNZZR1nXEZgvG8tDLCCY1F19xl20WlfTYgguB4VcNdxYk" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/contrib/mhchem.min.js"
        integrity="sha384-fB8BH//9nBzROkMUsu/Dr35jWHIbnKesUo9rW0hfEgw8mZGnkAyBAjKX9F98OVuo" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/marked@18.1.1/lib/marked.umd.js"
        integrity="sha384-rATToyt6602Jnq8c7w8HZwmyOUgPL7mzxX01FBWoV48ns/EgkakGozpES+PnaYOI" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js"
        integrity="sha384-P0JNneQf81HOl9VwNXK76cQ9VMD6Nfsnepxb0cCOg8+UzEdzgPHAPV4wVQrvYQSx" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/jszip@3.10.2/dist/jszip.min.js"
        integrity="sha384-DdGlNq+wVXAn83gXqwyeFHB7iyXy6L0rLrNzgDmhKWPjiJLg9vj6qosYmZmkMfQ+" crossorigin="anonymous"></script>

<style>
/* ===========================================================================
   DESIGN TOKENS
   Change colours and fonts here. Fonts are system fonts so the app works
   offline.
   =========================================================================== */
:root {
  --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Charter, Georgia, "Times New Roman", serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --navy: #14244a;          /* top bar */
  --navy-2: #1e3463;
  --accent: #2557a7;        /* buttons, links, focus */
  --accent-ink: #ffffff;
  --accent-soft: #e8effa;

  --bg: #e8ebf0;            /* desk colour behind the pages */
  --page: #ffffff;          /* the exam paper */
  --ink: #1a1d23;
  --muted: #5b6372;
  --line: #d3d8e0;
  --line-soft: #e7eaef;
  --field: #fbfcfd;         /* answer box background */

  --ok: #1d7348;   --ok-soft: #e2f3e9;
  --warn: #8a5300; --warn-soft: #fff1d6; --warn-strong: #f2a516;
  --danger: #b42318; --danger-soft: #fde7e5;
  --flag: #c2410c; --flag-soft: #ffedd5;
  --mark: #fff275;          /* highlighter */

  --scale: 1;               /* text size, set from Display settings */
  --top-h: 112px;           /* height of the sticky header, measured by JS */
  --radius: 6px;
}

/* Display settings: page colour overlays (common exam access arrangement) */
body[data-theme="cream"]  { --page: #fbf5e4; --field: #fffdf6; }
body[data-theme="blue"]   { --page: #e9f2fc; --field: #f5f9fe; }
body[data-theme="green"]  { --page: #e9f5e9; --field: #f6fbf6; }
body[data-theme="yellow"] { --page: #fffbd6; --field: #fffde9; }
body[data-theme="dark"]   {
  --bg: #0d0f13; --page: #1a1d24; --field: #20242c; --ink: #eef0f4; --muted: #a3abb9;
  --line: #343a47; --line-soft: #2a2f3a; --accent-soft: #233456; --mark: #8a7a00;
  --ok-soft: #173a29; --warn-soft: #3d2c0b; --danger-soft: #3f1814; --flag-soft: #3f2410;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--ui);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.ic { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 13px; border-radius: var(--radius);
  border: 1px solid var(--line); background: #fff; color: #1a1d23;
  font-weight: 550; font-size: 14px; white-space: nowrap;
  transition: background .12s, border-color .12s, box-shadow .12s;
}
.btn:hover:not(:disabled) { background: #f3f5f8; border-color: #b9c1cd; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { background: #1d4a91; }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.danger:hover:not(:disabled) { background: #9a1d13; }
.btn.lg { padding: 11px 22px; font-size: 16px; }
.btn.sm { padding: 4px 9px; font-size: 13px; gap: 5px; }
.btn.sm svg.ic { width: 15px; height: 15px; }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn.light { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.28); color: #fff; }
.btn.light:hover:not(:disabled) { background: rgba(255,255,255,.18); border-color: rgba(255,255,255,.5); }
.btn.submit { background: #f2f5fa; border-color: #fff; color: var(--navy); }
.btn.submit:hover:not(:disabled) { background: #fff; }

/* ===========================================================================
   HEADER (sticky): title, progress, timer, actions + toolbar + banner
   =========================================================================== */
#topbar { position: sticky; top: 0; z-index: 40; box-shadow: 0 2px 8px rgba(10,20,40,.12); }
.bar-main {
  background: var(--navy); color: #fff;
  display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(170px, 1fr) auto minmax(0, 1fr);
  align-items: center; gap: 20px; padding: 10px 20px;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo {
  width: 34px; height: 34px; border-radius: 7px; flex: none;
  display: grid; place-items: center; background: #fff; color: var(--navy);
  font-family: var(--serif); font-weight: 700; font-size: 20px;
}
.brand-text { min-width: 0; }
.brand-name { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; opacity: .7; font-weight: 600; }
.paper-title { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.progress { min-width: 0; }
.progress-label { font-size: 13px; display: flex; justify-content: space-between; gap: 10px; }
.progress-label b { font-variant-numeric: tabular-nums; }
.progress-track { height: 5px; border-radius: 3px; background: rgba(255,255,255,.18); margin: 5px 0 3px; overflow: hidden; }
.progress-fill { height: 100%; width: 0; background: #7fb2ff; transition: width .3s; }
.save-status { font-size: 12px; opacity: .75; display: flex; align-items: center; gap: 5px; }
.save-status.err { opacity: 1; color: #ffb4ab; }

.timer-box { text-align: center; padding: 3px 16px 4px; border-radius: 8px; background: rgba(255,255,255,.08); min-width: 150px; transition: background .2s; }
.timer-label { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; opacity: .78; display: flex; gap: 8px; justify-content: center; align-items: center; }
.timer { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: .02em; line-height: 1.15; }
.timer-toggle { background: none; border: 0; color: inherit; opacity: .8; font-size: 11px; text-decoration: underline; padding: 0; }
.timer-box.warn { background: var(--warn-strong); color: #1a1d23; }
.timer-box.danger { background: #d92d20; color: #fff; animation: pulse 2s ease-in-out infinite; }
.timer-box.done { background: rgba(255,255,255,.14); }
@keyframes pulse { 50% { background: #b42318; } }
.timer-hidden .timer { font-size: 15px; padding: 6px 0; opacity: .85; }

.bar-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

.bar-tools {
  background: #fff; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 8px 18px; flex-wrap: wrap; padding: 7px 20px;
  color: #1a1d23;
}
.tool-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.tool-group.right { margin-left: auto; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.seg button { border: 0; background: #fff; padding: 5px 11px; font-size: 13px; font-weight: 550; display: inline-flex; gap: 6px; align-items: center; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent-soft); color: var(--accent); }
.tools-label { font-size: 12px; color: #5b6372; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }

/* Time warning banner (below the toolbar, still sticky) */
.banner {
  display: flex; align-items: center; gap: 12px; padding: 9px 20px;
  font-weight: 600; font-size: 14.5px; border-bottom: 1px solid transparent;
}
.banner.warn { background: var(--warn-soft); color: var(--warn); border-color: #f3d39a; }
.banner.danger { background: #fde7e5; color: #8f1d14; border-color: #f4b8b1; }
.banner.info { background: var(--accent-soft); color: var(--accent); border-color: #c4d5f0; }
.banner .grow { flex: 1; }
.banner button { background: none; border: 0; color: inherit; display: inline-flex; padding: 3px; border-radius: 4px; }
.banner button:hover { background: rgba(0,0,0,.06); }

/* ===========================================================================
   COVER PAGE (before the exam starts)
   =========================================================================== */
.screen { padding: 28px 20px 60px; }
.page {
  background: var(--page); color: var(--ink);
  border-radius: 4px;
  box-shadow: 0 1px 2px rgba(15,25,45,.06), 0 0 0 1px var(--line-soft), 0 6px 24px rgba(15,25,45,.05);
}
.cover { max-width: 820px; margin: 0 auto; padding: 48px 56px 44px; font-size: calc(16px * var(--scale)); }
.cover-kicker { font-size: .8em; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 650; }
.cover-title { font-family: var(--serif); font-weight: 600; font-size: 2.1em; line-height: 1.15; margin: 10px 0 26px; }
.cover-meta { display: grid; grid-template-columns: repeat(4, 1fr); margin: 0 0 28px; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--line); }
.cover-meta div { padding: 12px 14px 12px 0; }
.cover-meta div + div { padding-left: 14px; border-left: 1px solid var(--line); }
.cover-meta dt { font-size: .75em; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 650; }
.cover-meta dd { margin: 2px 0 0; font-size: 1.25em; font-weight: 600; font-variant-numeric: tabular-nums; }
.cover-form { display: grid; grid-template-columns: 1.3fr 1fr; gap: 18px; margin-bottom: 26px; }
.field-label { display: block; font-size: .85em; font-weight: 650; margin-bottom: 6px; }
.field-label span { font-weight: 400; color: var(--muted); }
.input {
  width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--field); color: var(--ink);
}
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.dur-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.dur-row .input { width: 92px; }
.chip-btn { white-space: nowrap; border: 1px solid var(--line); background: var(--field); border-radius: 999px; padding: 4px 10px; font-size: .82em; color: var(--ink); }
.chip-btn:hover { border-color: var(--accent); color: var(--accent); }
.chip-btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.cover-instr { border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 22px 8px; margin-bottom: 28px; }
.cover-instr h2 { font-size: .8em; text-transform: uppercase; letter-spacing: .08em; margin: 0 0 8px; }
.cover-instr ol { margin: 0; padding-left: 1.3em; font-family: var(--serif); font-size: 1.02em; }
.cover-instr li { margin-bottom: 8px; }
.cover-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.cover-note { color: var(--muted); font-size: .85em; margin-left: auto; }

/* ===========================================================================
   EXAM VIEW: navigator (left) + questions (right)
   =========================================================================== */
.exam { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: calc(100vh - var(--top-h)); }
.nav {
  position: sticky; top: var(--top-h); align-self: start;
  height: calc(100vh - var(--top-h)); overflow: auto;
  background: #fff; border-right: 1px solid var(--line); padding: 16px 14px 20px;
  color: #1a1d23;
}
.nav h2 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: #5b6372; margin: 0 0 10px; }
.nav-task { font-size: 12px; font-weight: 600; color: #5b6372; margin: 14px 0 6px; line-height: 1.3; }
.nav-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; }
.nav-q {
  position: relative; height: 42px; border-radius: 6px;
  border: 1px solid #c9d0db; background: #fff; font-weight: 650; font-size: 13.5px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1;
}
.nav-q:hover { border-color: var(--accent); }
.nav-q.answered { background: #dfe9f9; border-color: #9db8e6; color: #173f80; }
.nav-q.current { outline: 2.5px solid var(--accent); outline-offset: 1px; }
.nav-q .fl { position: absolute; top: -6px; right: -6px; width: 17px; height: 17px; border-radius: 50%; background: var(--flag); color: #fff; display: none; place-items: center; }
.nav-q .fl svg { width: 10px; height: 10px; stroke-width: 3; }
.nav-q.flagged .fl { display: grid; }
.nav-q .sc { font-size: 10.5px; font-weight: 600; opacity: .8; }
.nav-q.full { background: var(--ok-soft); border-color: #8fcaa9; color: var(--ok); }
.nav-q.part { background: #fff6dc; border-color: #ecc56d; color: #7a4a00; }
.nav-q.zero { background: #fdeceb; border-color: #f0aaa3; color: #9b1c12; }
.nav-legend { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line-soft); font-size: 12px; color: #5b6372; display: grid; gap: 6px; }
.nav-legend span { display: flex; align-items: center; gap: 8px; }
.sw { width: 14px; height: 14px; border-radius: 3px; border: 1px solid #c9d0db; background: #fff; flex: none; }
.sw.ans { background: #dfe9f9; border-color: #9db8e6; }
.sw.fl { background: var(--flag); border-color: var(--flag); border-radius: 50%; }
.nav-summary { margin-top: 14px; font-size: 12.5px; color: #5b6372; }

.paper { padding: 24px 28px 80px; min-width: 0; }

/* ---------- One question card = one "page" ---------- */
.q {
  max-width: 900px; margin: 0 auto 22px;
  padding: 0 0 28px;
  font-size: calc(17px * var(--scale));
  scroll-margin-top: calc(var(--top-h) + 16px);
}
.view-paged .q.has-stim { max-width: 1320px; }
.q-task {
  font-size: .78em; font-weight: 650; letter-spacing: .05em; text-transform: uppercase;
  color: var(--muted); padding: 16px 40px 0;
}
.q-head {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 40px 14px; border-bottom: 1px solid var(--line-soft); margin-bottom: 22px;
}
.q-id { font-family: var(--serif); font-weight: 700; font-size: 1.32em; }
.q-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  font-size: .72em; font-weight: 650; padding: 3px 9px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--muted); letter-spacing: .02em;
}
.chip.term { background: var(--accent-soft); border-color: transparent; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }
.q-marks { margin-left: auto; font-family: var(--serif); font-weight: 700; font-size: 1.02em; white-space: nowrap; }
.flag-btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px;
  border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: .76em; font-weight: 600;
}
.flag-btn:hover { border-color: var(--flag); color: var(--flag); }
.flag-btn[aria-pressed="true"] { background: var(--flag-soft); border-color: var(--flag); color: var(--flag); }
.flag-btn svg.ic { width: 14px; height: 14px; }

.q-body { padding: 0 40px; }
.view-paged .q.has-stim .q-body {
  display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 0; padding: 0;
}
.view-paged .q.has-stim .q-stim {
  padding: 0 32px 0 40px; border-right: 1px solid var(--line-soft); margin: 0;
  position: sticky; top: calc(var(--top-h) + 16px); align-self: start;
  max-height: calc(100vh - var(--top-h) - 40px); overflow: auto;
}
.view-paged .q.has-stim .q-main { padding: 0 40px 0 32px; }

/* Stimulus / source material */
.q-stim { margin-bottom: 22px; }
.stim-label { font-size: .72em; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.q-stim .rich { border-left: 3px solid var(--line); padding-left: 16px; }
.img-error { font-size: .8em; color: var(--danger); padding: 10px; border: 1px dashed var(--danger); border-radius: 4px; font-family: var(--ui); text-align: left; }

/* Figures: the "image"/"images" fields and Markdown images. Always fit the column. */
.q-fig { margin: 16px 0 0; text-align: center; break-inside: avoid; }
.q-fig + .q-fig { margin-top: 20px; }
.q-fig img, .rich img { max-width: 100%; height: auto; border: 1px solid var(--line-soft); border-radius: 4px; background: #fff; }
.rich img { display: block; margin: .6em auto; }
.q-fig figcaption { margin-top: 6px; font-size: .85em; color: var(--muted); font-style: italic; }

/* Rich text (question text, stimulus, mark scheme) */
.rich { font-family: var(--serif); line-height: 1.62; }
.rich p { margin: 0 0 .75em; }
.rich p:last-child { margin-bottom: 0; }
.rich ul, .rich ol { margin: .2em 0 .8em; padding-left: 1.3em; }
.rich li { margin-bottom: .35em; }
.rich code { font-family: var(--mono); font-size: .88em; background: var(--line-soft); padding: 0 4px; border-radius: 3px; }

/* Exam-style tables (Markdown tables and the structured "table" field).
   The wrapper scrolls sideways on narrow screens instead of squashing the table. */
.table-wrap { overflow-x: auto; margin: .7em 0 1em; -webkit-overflow-scrolling: touch; }
.exam-table { border-collapse: collapse; font-family: var(--ui); font-size: .86em; font-variant-numeric: tabular-nums; min-width: min(100%, 320px); }
.exam-table caption { caption-side: top; text-align: left; font-weight: 650; padding: 0 0 6px; font-size: 1em; }
.exam-table th, .exam-table td { border: 1px solid color-mix(in srgb, var(--ink) 35%, var(--line)); padding: 6px 12px; text-align: center; vertical-align: middle; }
.exam-table th { background: color-mix(in srgb, var(--line-soft) 80%, transparent); font-weight: 650; }
.exam-table td:first-child, .exam-table th:first-child { text-align: left; }
.exam-table th[align="left"], .exam-table td[align="left"] { text-align: left; }
.exam-table th[align="right"], .exam-table td[align="right"] { text-align: right; }

/* Maths */
.katex { font-size: 1.08em; }
.katex-display { margin: .6em 0; overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
.math-block { margin: .6em 0; }
.math-err {
  font-family: var(--mono); font-size: .85em; white-space: pre-wrap;
  background: var(--danger-soft); color: var(--danger); border-bottom: 2px wavy var(--danger);
  border-radius: 3px; padding: 0 3px; cursor: help;
}
.q-prompt { font-size: 1.04em; margin-bottom: 18px; }
mark.hl { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
body.hl-on .hl-zone { cursor: text; }
body.hl-on .hl-zone::selection, body.hl-on .hl-zone *::selection { background: #ffe86b; }
body.hl-on mark.hl { cursor: pointer; }

/* ---------- Answer area ---------- */
.ans-tools {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  padding: 6px 8px; border: 1px solid var(--line); border-bottom: 0;
  border-radius: var(--radius) var(--radius) 0 0; background: color-mix(in srgb, var(--page) 70%, var(--line-soft));
  font-family: var(--ui); font-size: 13px;
}
.ans-tools .btn { background: var(--field); color: var(--ink); }
.ans-tools .hint { color: var(--muted); font-size: 12px; }
.ans-tools .wc { margin-left: auto; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.editor {
  min-height: calc(var(--lines, 6) * 1.75em);
  padding: 12px 14px; line-height: 1.75;
  font-family: var(--serif); font-size: 1em;
  border: 1px solid var(--line); border-radius: 0 0 var(--radius) var(--radius);
  background: var(--field); color: var(--ink);
  white-space: pre-wrap; overflow-wrap: anywhere;
  outline: none; cursor: text;
}
.editor:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.editor.is-empty::before { content: attr(data-placeholder); color: var(--muted); opacity: .7; pointer-events: none; font-style: italic; }
.locked .editor { cursor: default; background: color-mix(in srgb, var(--field) 60%, var(--line-soft)); }
.locked .editor.is-empty::before { content: "No answer given."; }
.locked .ans-tools .btn, .locked .ans-tools .hint { display: none; }

/* Inline equations inside an answer */
.mwrap { display: inline-block; vertical-align: middle; margin: 0 2px; }
math-field {
  display: inline-block; min-width: 2.2em; vertical-align: middle;
  padding: 1px 4px; border-radius: 4px; font-size: 1.05em;
  border: 1px dashed color-mix(in srgb, var(--accent) 45%, transparent);
  background: color-mix(in srgb, var(--accent-soft) 55%, transparent);
  color: inherit; --caret-color: var(--accent); --selection-background-color: #cfe0ff;
}
math-field:focus-within { outline: none; border-style: solid; border-color: var(--accent); background: var(--accent-soft); }
math-field::part(virtual-keyboard-toggle), math-field::part(menu-toggle) { display: none; }
.locked math-field { border-color: transparent; background: transparent; }

/* Multiple choice */
.mcq { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
.opt {
  display: flex; align-items: center; gap: 14px; padding: 11px 14px; cursor: pointer;
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--field);
  font-family: var(--serif);
}
.opt:hover { border-color: var(--accent); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt-letter {
  width: 28px; height: 28px; flex: none; border-radius: 50%; display: grid; place-items: center;
  border: 1.5px solid var(--muted); font-family: var(--ui); font-weight: 700; font-size: .8em;
}
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt:has(input:checked) .opt-letter { background: var(--accent); border-color: var(--accent); color: #fff; }
.opt:has(input:focus-visible) { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); }
.locked .opt { cursor: default; }
.opt.correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.correct .opt-letter { border-color: var(--ok); color: var(--ok); }
.opt.correct:has(input:checked) .opt-letter { background: var(--ok); color: #fff; }
.opt.wrong:has(input:checked) { border-color: var(--danger); background: var(--danger-soft); }
.opt.wrong:has(input:checked) .opt-letter { background: var(--danger); border-color: var(--danger); }

/* ---------- Review mode: answer beside the mark scheme ---------- */
.q.reviewing .q-work { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .95fr); gap: 22px; align-items: start; }
.review { display: none; }
.q.reviewing .review { display: block; }
.ms-box { border: 1px solid #a9d3bb; background: var(--ok-soft); border-radius: var(--radius); padding: 12px 16px 14px; }
body[data-theme="dark"] .ms-box { border-color: #2c6a49; }
.ms-label { font-family: var(--ui); font-size: .7em; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ok); margin-bottom: 6px; }
.ms-box .rich { font-size: .93em; }
.ms-none { color: var(--muted); font-style: italic; font-size: .9em; }
.mcq-key { font-family: var(--ui); font-size: .82em; margin-top: 8px; color: var(--muted); }
.award {
  margin-top: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--field); font-family: var(--ui); font-size: 14px;
}
.award-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.award label { font-weight: 650; }
.award input { width: 70px; padding: 6px 8px; text-align: center; font-weight: 700; font-size: 16px; }
.award .of { font-weight: 650; color: var(--muted); }
.award-pills { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
.award-pills button { min-width: 30px; height: 28px; border-radius: 5px; border: 1px solid var(--line); background: var(--page); font-weight: 650; font-size: 13px; }
.award-pills button:hover { border-color: var(--accent); }
.award-pills button.on { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ---------- Results card ---------- */
.results { max-width: 900px; margin: 0 auto 22px; padding: 26px 40px 24px; }
.results h2 { font-family: var(--serif); font-size: 1.5em; margin: 0 0 4px; }
.results .sub { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
.res-grid { display: grid; grid-template-columns: auto 1fr; gap: 26px; align-items: center; }
.res-score { font-family: var(--serif); font-size: 46px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.res-score small { font-size: 22px; color: var(--muted); font-weight: 600; }
.res-pct { font-size: 15px; font-weight: 650; margin-top: 6px; color: var(--accent); }
.res-facts { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 14px; color: var(--muted); }
.res-facts b { color: var(--ink); }
.crit-table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; font-variant-numeric: tabular-nums; }
.crit-table th, .crit-table td { padding: 6px 10px; border-bottom: 1px solid var(--line-soft); text-align: left; }
.crit-table th { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.crit-bar { height: 6px; border-radius: 3px; background: var(--line-soft); overflow: hidden; min-width: 80px; }
.crit-bar i { display: block; height: 100%; background: var(--accent); }
.res-actions { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line-soft); font-size: 14px; }
.res-actions label { display: inline-flex; align-items: center; gap: 7px; }
.grade-note { font-size: 12px; color: var(--muted); }

/* ---------- Pager (one-question view) ---------- */
.pager { max-width: 900px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--muted); }
.view-paged .q.has-stim ~ .pager { max-width: 1320px; }
.view-all .pager { display: none; }

/* ===========================================================================
   MODALS, TOASTS, FLOATING PANELS
   =========================================================================== */
dialog.modal {
  border: 0; border-radius: 10px; padding: 0; width: min(560px, calc(100vw - 32px));
  box-shadow: 0 24px 64px rgba(10,20,40,.3); color: #1a1d23; background: #fff;
}
dialog.modal.wide { width: min(760px, calc(100vw - 32px)); }
dialog.modal::backdrop { background: rgba(14,22,40,.5); }
.modal-head { padding: 20px 24px 0; }
.modal-head h2 { margin: 0; font-size: 19px; }
.modal-body { padding: 12px 24px 4px; font-size: 14.5px; max-height: calc(100vh - 220px); overflow: auto; }
.modal-body p { margin: 0 0 12px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 16px 24px 20px; flex-wrap: wrap; }
.modal-actions .spacer { margin-right: auto; }
.drop {
  border: 2px dashed #c3cbd8; border-radius: 8px; padding: 22px; text-align: center; color: #5b6372;
  transition: border-color .15s, background .15s;
}
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop p { margin: 0 0 10px; }
.or { text-align: center; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #8a93a3; margin: 14px 0 8px; }
textarea.json-in { width: 100%; min-height: 170px; font-family: var(--mono); font-size: 12.5px; padding: 10px; border: 1px solid var(--line); border-radius: var(--radius); resize: vertical; }
.err { color: var(--danger); background: var(--danger-soft); border-radius: 6px; padding: 8px 12px; font-size: 13.5px; margin-top: 10px; }
.note { background: var(--warn-soft); color: var(--warn); border-radius: 6px; padding: 9px 12px; font-size: 13.5px; margin-bottom: 14px; }
details.fmt { margin-top: 12px; font-size: 13px; }
.drop .btn { margin: 3px; }
.fmt-note { margin: 10px 0 0 !important; font-size: 13px; color: #1a1d23; }
details.fmt summary { cursor: pointer; color: var(--accent); font-weight: 600; }
details.fmt pre { background: #f4f6f9; border-radius: 6px; padding: 10px 12px; font-size: 12px; overflow: auto; }
.check-list { list-style: none; padding: 0; margin: 8px 0 14px; display: flex; flex-wrap: wrap; gap: 6px; }
.check-list button { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 4px 10px; font-weight: 650; font-size: 13px; }
.check-list button:hover { border-color: var(--accent); color: var(--accent); }
.summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
.summary-grid div { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.summary-grid b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.summary-grid span { font-size: 12px; color: #5b6372; }

#toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
  background: #1a1d23; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 14px;
  box-shadow: 0 10px 30px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  z-index: 100; max-width: calc(100vw - 32px);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.panel {
  position: fixed; z-index: 60; width: 300px; background: #fff; color: #1a1d23;
  border-radius: 10px; box-shadow: 0 16px 48px rgba(10,20,40,.25), 0 0 0 1px rgba(10,20,40,.08);
  display: flex; flex-direction: column;
}
.panel-head {
  display: flex; align-items: center; gap: 8px; padding: 9px 10px 9px 14px; cursor: move; user-select: none;
  background: var(--navy); color: #fff; border-radius: 10px 10px 0 0; font-weight: 650; font-size: 14px;
}
.panel-head .grow { flex: 1; }
.panel-head button { background: none; border: 0; color: #fff; display: inline-flex; padding: 3px; border-radius: 4px; }
.panel-head button:hover { background: rgba(255,255,255,.15); }
.panel-body { padding: 12px; }
.notepad-ta { width: 100%; height: 240px; resize: vertical; border: 1px solid var(--line); border-radius: 6px; padding: 10px; font-family: var(--ui); font-size: 14px; line-height: 1.5; }
.panel-foot { font-size: 12px; color: #5b6372; margin-top: 6px; }

/* Calculator (Desmos in an iframe). Drag the bottom-right corner to resize. */
#panel-calc {
  width: 420px; height: 560px; min-width: 300px; min-height: 360px;
  max-width: calc(100vw - 16px); max-height: calc(100vh - 16px);
  resize: both; overflow: hidden;
}
#panel-calc .panel-body { flex: 1; padding: 0; display: flex; flex-direction: column; min-height: 0; }
.desmos-frame { flex: 1; width: 100%; border: 0; border-radius: 0 0 10px 10px; background: #fff; }
.panel.dragging iframe { pointer-events: none; }
.calc-tabs { display: inline-flex; border: 1px solid rgba(255,255,255,.35); border-radius: 6px; overflow: hidden; }
.panel-head .calc-tabs button { border-radius: 0; padding: 3px 10px; font-size: 12.5px; font-weight: 600; color: #fff; }
.panel-head .calc-tabs button[aria-selected="true"] { background: #fff; color: var(--navy); }
.calc-offline { margin: 0; padding: 8px 12px; font-size: 13px; background: var(--warn-soft); color: var(--warn); }

/* Display settings */
.disp-row { margin-bottom: 14px; }
.disp-row h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: #5b6372; margin: 0 0 7px; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatches button { width: 38px; height: 38px; border-radius: 8px; border: 1px solid #c3cbd8; font-size: 11px; font-weight: 700; }
.swatches button.on { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ===========================================================================
   RESOURCES: side tab + drawer (periodic table, formula sheets, data booklets)
   The drawer does not block the paper, so students can read it while answering.
   =========================================================================== */
:root { --res-w: 520px; }
body.res-pt { --res-w: min(860px, calc(100vw - 160px)); }     /* the periodic table needs room */
body.res-wide { --res-w: min(1080px, calc(100vw - 240px)); }
.res-tab {
  position: fixed; z-index: 56; right: 0; top: calc(var(--top-h) + 96px);
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 14px 8px; border: 0; border-radius: 8px 0 0 8px;
  background: var(--navy); color: #fff; font-weight: 650; font-size: 13px; letter-spacing: .04em;
  box-shadow: -2px 4px 14px rgba(10,20,40,.22); transition: right .2s ease, background .15s;
}
.res-tab span { writing-mode: vertical-rl; }
.res-tab:hover { background: var(--navy-2); }
.res-tab .res-count { background: #fff; color: var(--navy); border-radius: 999px; min-width: 20px; height: 20px; font-size: 11.5px; display: grid; place-items: center; padding: 0 5px; }
body.res-open .res-tab { right: var(--res-w); }

.res-drawer {
  position: fixed; z-index: 55; right: 0; top: var(--top-h); bottom: 0; width: var(--res-w);
  max-width: 100vw; background: #fff; color: #1a1d23; border-left: 1px solid #d3d8e0;
  box-shadow: -10px 0 30px rgba(10,20,40,.16); display: flex; flex-direction: column;
}
.res-head { position: relative; display: flex; align-items: center; gap: 8px; padding: 9px 10px 9px 14px; background: var(--navy); color: #fff; font-size: 14px; }
.res-head .grow { flex: 1; }
.res-head button { display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; color: #fff; padding: 4px 6px; border-radius: 5px; font-size: 13px; font-weight: 600; }
.res-head button:hover, .res-head button.on { background: rgba(255,255,255,.16); }
.res-menu { position: absolute; right: 10px; top: calc(100% + 4px); z-index: 2; background: #fff; border: 1px solid #d3d8e0; border-radius: 8px; box-shadow: 0 10px 30px rgba(10,20,40,.2); padding: 4px; display: flex; flex-direction: column; min-width: 240px; }
.res-head .res-menu button { color: #1a1d23; justify-content: flex-start; padding: 8px 10px; font-weight: 500; }
.res-head .res-menu button:hover { background: #e8effa; }
.res-tabs { display: flex; gap: 2px; padding: 8px 10px 0; border-bottom: 1px solid #d3d8e0; overflow-x: auto; background: #f5f7fa; flex: none; }
.res-tabs button { border: 1px solid transparent; border-bottom: 0; background: none; padding: 7px 12px; border-radius: 6px 6px 0 0; font-size: 13px; font-weight: 600; color: #5b6372; white-space: nowrap; }
.res-tabs button[aria-selected="true"] { background: #fff; border-color: #d3d8e0; color: var(--accent); margin-bottom: -1px; }
.res-body { flex: 1; min-height: 0; overflow: auto; padding: 14px 16px 24px; }
.res-rich { font-family: var(--serif); font-size: calc(16px * var(--scale)); line-height: 1.55; }
.res-rich h1, .res-rich h2, .res-rich h3 { font-family: var(--ui); margin: 1em 0 .4em; }
.res-rich h1 { font-size: 1.2em; } .res-rich h2 { font-size: 1.08em; } .res-rich h3 { font-size: 1em; }
.res-rich > :first-child { margin-top: 0; }
.res-file-bar { display: flex; align-items: center; gap: 12px; justify-content: flex-end; margin-bottom: 8px; font-size: 13px; }
.res-file-bar .res-hint { margin-right: auto; color: #5b6372; }
.res-open-tab { display: inline-flex; align-items: center; gap: 5px; color: var(--accent); font-weight: 600; text-decoration: none; }
.res-open-tab .ic { width: 15px; height: 15px; }
.res-remove { border: 1px solid #d3d8e0; background: #fff; border-radius: 6px; padding: 3px 10px; font-size: 12.5px; color: var(--danger); }
.res-note { font-size: 13px; color: var(--warn); background: var(--warn-soft); padding: 8px 10px; border-radius: 6px; margin: 0 0 8px; }
.res-pdf { width: 100%; height: calc(100% - 34px); min-height: 420px; border: 1px solid #d3d8e0; border-radius: 6px; background: #f5f7fa; }
.res-img { display: block; max-width: 100%; margin: 0 auto; cursor: zoom-in; }
.res-img.zoom { max-width: none; cursor: zoom-out; }
.res-empty { text-align: center; color: #5b6372; padding: 30px 10px; }
.res-empty-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }

/* Periodic table */
.pt-wrap { overflow-x: auto; padding-bottom: 6px; }
.pt { display: grid; grid-template-columns: 18px repeat(18, minmax(40px, 1fr)); gap: 2px; min-width: 780px; font-family: var(--ui); }
.pt-gn, .pt-pn { font-size: 10.5px; color: #5b6372; font-weight: 650; display: grid; place-items: center; }
.pt-el { border: 1px solid rgba(20,36,74,.22); border-radius: 3px; padding: 2px 1px 3px; display: flex; flex-direction: column; align-items: center; line-height: 1.08; color: #14182a; font: inherit; min-height: 46px; }
button.pt-el:hover, .pt-el.sel { outline: 2px solid var(--accent); outline-offset: 0; z-index: 1; }
.pt-el .z { font-size: 9.5px; align-self: flex-start; padding-left: 3px; }
.pt-el .s { font-size: 15px; font-weight: 700; }
.pt-el .m { font-size: 9px; }
.pt-ref { justify-content: center; } .pt-ref .s { font-size: 10px; font-weight: 600; }
.pt-gap { grid-row: 9; height: 8px; }
.pt-key { display: flex; align-items: center; gap: 12px; padding: 4px 8px; }
.pt-sample { width: 118px; min-height: 64px; background: #fff; flex: none; justify-content: center; }
.pt-sample .z, .pt-sample .m { font-size: 9px; align-self: center; padding: 0; color: #5b6372; white-space: nowrap; }
.pt-sample .s { font-size: 14px; margin: 3px 0; }
.pt-info { font-size: 13px; color: #1a1d23; line-height: 1.4; }
.pt-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 12px; color: #5b6372; font-family: var(--ui); }
.pt-legend span { display: inline-flex; align-items: center; gap: 5px; }

<script>
'use strict';

/* ==========================================================================

   ========================================================================== */

const STORE = {
  session: 'papersim.session.v1',   // answers, timer, marks, flags, notes
  paper: 'papersim.paper.v1',       // the currently loaded paper
  settings: 'papersim.settings.v1', // text size, page colour (kept across resets)
};
const AUTOSAVE_MS = 3000;           // autosave interval
const WARNING_MINUTES = [30, 10];   // banner warnings at these minutes remaining
const DEFAULT_DURATION = 120;       // minutes, used when a paper has none
const ZWSP = '\u200B';              // invisible caret anchor next to equations
const LETTERS = 'ABCDEFGHIJ';

// Same content as sample-paper.json, so the app works straight away.
const SAMPLE_PAPER = {

        "Kinetic energy"
      ],
      "correctOption": "C",
      "markScheme": "**C**: displacement. It has both magnitude and direction. [1]"
    },
    {
      "id": "1b",
      "task": "Task 1: Motion of a cyclist",
      "criterion": "A",
      "marks": 3,
      "commandTerm": "Calculate",
      "context": "A cyclist starts from rest and accelerates uniformly along a straight, flat road. After 4.0 s the cyclist's speed is 8.0 m s⁻¹.",
      "text": "Calculate the acceleration of the cyclist **and** the distance travelled in the first 4.0 s. Show your working.",
      "markScheme": "- \\(a = \\frac{\\Delta v}{t} = \\frac{8.0}{4.0}\\) [1]\n- \\(a = 2.0\\ \\text{m s}^{-2}\\) [1]\n- \\(s = \\tfrac{1}{2}at^2 = \\tfrac{1}{2}(2.0)(4.0)^2 = 16\\ \\text{m}\\) [1]\nAward full marks for a correct final answer with units. Allow error carried forward from an incorrect acceleration."
    },
    {
      "id": "2",
      "task": "Task 2: Investigating a pendulum",
      "criterion": "C",
      "marks": 5,
      "commandTerm": "Analyse",
      "context": "A student investigated how the length of a pendulum, L, affects its period, T (the time for one complete swing). For each length the student timed 10 swings and divided by 10.\n\n| Length L (m) | Time for 10 swings (s) | Period T (s) |\n|---|---|---|\n| 0.20 | 9.0 | 0.90 |\n| 0.40 | 12.7 | 1.27 |\n| 0.60 | 15.5 | 1.55 |\n| 0.80 | 17.9 | 1.79 |\n| 1.00 | 20.1 | 2.01 |\n\nFor a simple pendulum, \\(T = 2\\pi\\sqrt{\\frac{L}{g}}\\).",
      "image": "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 260 210' width='260' height='210' font-family='Georgia, serif' font-size='15'><rect x='50' y='12' width='160' height='10' fill='%23555'/><line x1='130' y1='22' x2='130' y2='190' stroke='%23999' stroke-dasharray='4 4'/><line x1='130' y1='22' x2='180' y2='162' stroke='%23222' stroke-width='2'/><circle cx='180' cy='162' r='14' fill='%232a5caa'/><path d='M130 67 A45 45 0 0 0 145.1 64.4' fill='none' stroke='%23d97706' stroke-width='2'/><text x='134' y='88' fill='%23d97706'>&%23952;</text><text x='162' y='96'>L</text><text x='200' y='170'>bob</text><text x='60' y='205' font-size='12' fill='%23666'>Figure 1: a simple pendulum</text></svg>",
      "imageAlt": "Diagram of a simple pendulum of length L released from angle theta",
      "text": "Analyse the data to describe the relationship between L and T. Use the data and the equation in the source to estimate g, the gravitational field strength. State whether the results support the hypothesis that a longer pendulum has a longer period.",
      "markScheme": "- Describes the trend: T increases as L increases [1]\n- Recognises the relationship is **not** directly proportional, e.g. doubling L from 0.20 m to 0.40 m does not double T [1]\n- Rearranges correctly: \\(g = \\frac{4\\pi^2 L}{T^2}\\) [1]\n- Substitutes one data pair, e.g. \\(\\frac{4\\pi^2(1.00)}{2.01^2} \\approx 9.8\\ \\text{N kg}^{-1}\\) [1]\n- Valid conclusion that the data support the hypothesis [1]"
    },
    {
      "id": "3",
      "task": "Task 3: Electric buses",
      "criterion": "D",
      "marks": 6,
      "commandTerm": "Evaluate",
      "context": "A city council proposes replacing all of its diesel buses with battery-electric buses within five years. Supporters say this will reduce the city's carbon emissions. Some residents point out that most of the electricity used to charge the buses is generated in coal-fired power stations.",

      "markScheme": "Level descriptors:\n- **0**: does not reach a standard described below.\n- **1–2**: states one or two factors with little or no explanation.\n- **3–4**: discusses advantages and disadvantages of at least two factors with some explanation.\n- **5–6**: balanced evaluation of environmental, economic and social factors, supported by scientific reasoning, with a justified conclusion.\nIndicative content: no exhaust emissions, so better air quality in the city; total CO₂ depends on how the electricity is generated (coal compared with renewables); environmental cost of battery production and disposal; high purchase cost but lower fuel and maintenance costs; quieter buses; need for charging infrastructure; jobs and retraining."

/* ==========================================================================
   2. SMALL UTILITIES
   ========================================================================== */

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
const pad = n => String(n).padStart(2, '0');

/** 5400000 -> "1:30:00". Countdowns round up so 0:00:00 only shows at zero. */
function fmtClock(ms, roundUp = true) {
  const total = Math.max(0, roundUp ? Math.ceil(ms / 1000) : Math.floor(ms / 1000));
  const h = Math.floor(total / 3600), m = Math.floor(total / 60) % 60, s = total % 60;
  return `${h}:${pad(m)}:${pad(s)}`;
}
/** 5400000 -> "1 h 30 min" (for prose). */
function fmtDuration(ms) {
  const mins = Math.round(ms / 60000);
  if (mins < 1) return `${Math.max(1, Math.round(ms / 1000))} s`;
  const h = Math.floor(mins / 60), m = mins % 60;
  return h ? `${h} h${m ? ` ${m} min` : ''}` : `${m} min`;
}
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
const fmtNum = n => (Math.round(n * 100) / 100).toString();

/* ==========================================================================
   2b. RICH CONTENT: Markdown + maths + chemistry + tables + images
   --------------------------------------------------------------------------
   Every piece of paper text (text, context, markScheme, options, captions,
   table cells) goes through renderRich():

     1. protectMath   cut out the maths ($...$, $$...$$, \(...\), \[...\]) and
                      put placeholders in its place, so Markdown cannot mangle
                      the _ * \ inside LaTeX and "|" inside maths cannot split a table
     2. compat fixes  old-style "a | b | c" tables without a --- row, "•" bullets
     3. marked        Markdown with GitHub tables (GFM)
     4. DOMPurify     strips scripts, event handlers and javascript: links
     5. KaTeX         each placeholder becomes rendered maths (mhchem adds \ce{...});
                      invalid LaTeX is shown as raw text with a red underline
   Images are not loaded here: <img> gets data-src, and hydrateRich() resolves it
   (attached files, URL, data: URI or relative path) once the HTML is in the page.
   If the libraries could not load (offline), formatRichBasic() is used instead.
   ========================================================================== */

const MATH_TOKEN = k => `KXMATH${k}XK`;          // letters only: Markdown leaves it alone
const MATH_TOKEN_RE = /KXMATH(\d+)XK/g;
const texCache = new Map();

/** True once KaTeX (+mhchem), marked and DOMPurify have all loaded. */
function richReady() {
  return !!(window.katex && window.marked && window.DOMPurify);
}

/**
 * Finds the maths in a string. Returns { text, maths } where text has placeholders.
 * Single $...$ follows Pandoc's rule so prices are not mistaken for maths:
 * the opening $ must be followed by a non-space, the closing $ must follow a
 * non-space and must NOT be followed by a digit ("US$5 to US$10" stays text).
 * Write \$ for a literal dollar sign next to maths.
 */
function protectMath(src) {
  const maths = [];
  let out = '';
  const n = src.length;
  const push = (tex, display, raw) => { out += MATH_TOKEN(maths.length); maths.push({ tex, display, raw }); };
  let i = 0;
  while (i < n) {
    const c = src[i];
    if (c === '\\' && src[i + 1] === '$') { out += '\\$'; i += 2; continue; }
    if (c === '$' && src[i + 1] === '$') {
      const j = src.indexOf('$$', i + 2);
      if (j > i + 2) { push(src.slice(i + 2, j), true, src.slice(i, j + 2)); i = j + 2; continue; }
    } else if (c === '\\' && (src[i + 1] === '[' || src[i + 1] === '(')) {
      const close = src[i + 1] === '[' ? '\\]' : '\\)';
      const j = src.indexOf(close, i + 2);
      if (j > -1) { push(src.slice(i + 2, j), src[i + 1] === '[', src.slice(i, j + 2)); i = j + 2; continue; }
    } else if (c === '$' && i + 1 < n && !/\s/.test(src[i + 1])) {
      let j = i + 1;
      while ((j = src.indexOf('$', j)) !== -1) {
        if (src[j - 1] === '\\') { j++; continue; }                         // \$ inside: not the end
        if (!/\s/.test(src[j - 1]) && !/\d/.test(src[j + 1] || '')) break;   // a valid closing $
        j++;
      }
      if (j !== -1 && j > i + 1 && !/\n\s*\n/.test(src.slice(i + 1, j))) {
        push(src.slice(i + 1, j), false, src.slice(i, j + 1)); i = j + 1; continue;
      }
    }
    out += c;
    i++;
  }
  return { text: out, maths };
}

/** LaTeX -> KaTeX HTML. Invalid LaTeX never throws: it comes back as highlighted raw text. */
function texToHtml(m) {
  const key = (m.display ? 'D' : 'I') + m.tex;
  if (texCache.has(key)) return texCache.get(key);
  let html;
  try {
    html = katex.renderToString(m.tex, {
      displayMode: m.display, throwOnError: true, strict: 'ignore', trust: false, output: 'htmlAndMathml',
    });
  } catch (e) {
    const msg = String(e?.message || e).replace(/^KaTeX parse error:\s*/, '');
    html = `<span class="math-err" title="Could not render this maths: ${esc(msg)}">${esc(m.raw)}</span>`;
  }
  texCache.set(key, html);
  return html;
}

/** Collects LaTeX problems in a string (used to warn when a paper is loaded). */
function mathErrors(text) {
  if (!text || !window.katex) return [];
  return protectMath(String(text)).maths.flatMap(m => {
    try { katex.renderToString(m.tex, { displayMode: m.display, throwOnError: true, strict: 'ignore', trust: false }); return []; }
    catch (e) { return [`${m.raw} (${String(e?.message || e).replace(/^KaTeX parse error:\s*/, '').slice(0, 90)})`]; }
  });
}

/**
 * Backwards compatibility with papers written for the old formatter:
 * - "a | b | c" rows without a |---| line become a real table (2+ rows, same number of cells)
 * - lines starting with "•" become Markdown bullets
 */
function compatMarkdown(src) {
  const lines = src.split(/\r?\n/);
  const isDelim = l => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
  const cellCount = l => l.trim().replace(/^\|/, '').replace(/\|$/, '').split(/(?<!\\)\|/).length;
  const hasPipe = l => /(?<!\\)\|/.test(l) && cellCount(l) >= 2;
  const out = [];
  for (let i = 0; i < lines.length;) {
    if (hasPipe(lines[i])) {
      let j = i;
      while (j < lines.length && hasPipe(lines[j])) j++;
      const block = lines.slice(i, j);
      const n = cellCount(block[0]);
      const consistent = block.length >= 2 && block.every(l => cellCount(l) === n);
      const alreadyGfm = block.length >= 2 && isDelim(lines[i + 1] || '');
      if (out.length && out[out.length - 1].trim()) out.push('');   // a table must start a new block
      out.push(block[0]);
      if (consistent && !alreadyGfm) out.push('|' + ' --- |'.repeat(n));
      out.push(...block.slice(1));
      if (j < lines.length && lines[j].trim()) out.push('');
      i = j;
    } else {
      out.push(lines[i].replace(/^(\s*)•\s+/, '$1- '));
      i++;
    }
  }
  return out.join('\n');
}

const PURIFY = {
  ALLOWED_TAGS: ['p', 'br', 'strong', 'b', 'em', 'i', 'u', 's', 'del', 'sub', 'sup', 'small', 'mark', 'code', 'pre',
    'blockquote', 'ul', 'ol', 'li', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'hr', 'a', 'img', 'span', 'div',
    'table', 'thead', 'tbody', 'tr', 'th', 'td', 'caption'],
  ALLOWED_ATTR: ['href', 'title', 'alt', 'src', 'width', 'height', 'align', 'colspan', 'rowspan', 'start'],
  ALLOW_DATA_ATTR: false,
};

/**
 * Paper text -> safe HTML. opts.inline renders without wrapping <p> (options, table cells, captions).
 * Images come out as <img data-src="..."> and are loaded by hydrateRich().
 */
function renderRich(text, opts = {}) {
  if (text == null || text === '') return '';
  if (!richReady()) return opts.inline ? formatRichBasic(text).replace(/^<p>|<\/p>$/g, '') : formatRichBasic(text);
  const { text: guarded, maths } = protectMath(String(text));
  const md = opts.inline ? guarded : compatMarkdown(guarded);
  let html = opts.inline
    ? marked.parseInline(md, { gfm: true, breaks: true })
    : marked.parse(md, { gfm: true, breaks: true });
  html = DOMPurify.sanitize(html, PURIFY);
  // Display maths alone in a paragraph becomes a centred block
  html = html.replace(/<p>\s*KXMATH(\d+)XK\s*<\/p>/g, (all, k) =>
    maths[k]?.display ? `<div class="math-block">${texToHtml(maths[k])}</div>` : all);
  html = html.replace(MATH_TOKEN_RE, (_, k) => (maths[k] ? texToHtml(maths[k]) : ''));
  html = html.replace(/<table>/g, '<div class="table-wrap"><table class="exam-table">').replace(/<\/table>/g, '</table></div>');
  // Defer image loading to hydrateRich (so attached files and relative paths resolve)
  html = html.replace(/<img\b([^>]*?)\ssrc="([^"]*)"/g, '<img$1 data-src="$2"');
  return html;
}
const renderInline = text => renderRich(text, { inline: true });

/** Structured table: {"headers": [...], "rows": [[...]], "caption": "..."} -> exam table HTML. */
function tableToHtml(t) {
  const cell = (tag, v) => `<${tag}>${renderInline(v == null ? '' : String(v))}</${tag}>`;
  return `<div class="table-wrap"><table class="exam-table">`
    + (t.caption ? `<caption>${renderInline(t.caption)}</caption>` : '')
    + (t.headers.length ? `<thead><tr>${t.headers.map(h => cell('th', h)).join('')}</tr></thead>` : '')
    + `<tbody>${t.rows.map(r => `<tr>${r.map(c => cell('td', c)).join('')}</tr>`).join('')}</tbody></table></div>`;
}

/** One figure per image: {src, alt, caption, width}. */
function figuresHtml(images, fallbackAlt) {
  return images.map((img, k) => `
    <figure class="q-fig">
      <img data-src="${esc(img.src)}" alt="${esc(img.alt || `${fallbackAlt}${images.length > 1 ? ` (${k + 1})` : ''}`)}"${img.width ? ` style="width:${esc(img.width)}"` : ''}>
      ${img.caption ? `<figcaption>${renderInline(img.caption)}</figcaption>` : ''}
    </figure>`).join('');
}

/* ---------- Images attached with the paper (folder, zip or "Attach images") ---------- */

const assets = new Map();   // normalised path -> { name, url, blob }
const IMAGE_EXT = /\.(png|jpe?g|gif|svg|webp|bmp|avif)$/i;
const ASSET_EXT = /\.(png|jpe?g|gif|svg|webp|bmp|avif|pdf)$/i;   // files kept with a paper: images + PDF resources
const IMAGE_MIME = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', svg: 'image/svg+xml',
  webp: 'image/webp', bmp: 'image/bmp', avif: 'image/avif', pdf: 'application/pdf' };

const normAssetPath = p => {
  let s = String(p || '').trim().replace(/\\/g, '/');
  try { s = decodeURIComponent(s); } catch { /* keep as is */ }
  return s.replace(/^(\.\/)+/, '').replace(/^\/+/, '').toLowerCase();
};

/** Is this image source something we are willing to load? */
function safeImageSrc(src) {
  const s = String(src || '').trim();
  if (!s) return false;
  if (/^data:image\/[a-z0-9.+-]+[;,]/i.test(s)) return true;
  if (/^(https?:|blob:)/i.test(s)) return true;
  return !/^[a-z][a-z0-9+.-]*:/i.test(s);  // relative path: no other scheme (blocks javascript:, file:, ...)
}

/** Paper image reference -> URL the browser can load. Attached files win over relative paths. */
function resolveImageSrc(src) {
  const s = String(src || '').trim();
  if (!safeImageSrc(s)) return '';
  if (/^(data:|https?:|blob:)/i.test(s)) return s;
  const key = normAssetPath(s);
  if (assets.has(key)) return assets.get(key).url;
  const base = key.split('/').pop();
  for (const [k, v] of assets) if (k.split('/').pop() === base) return v.url;   // "diagram.png" matches "images/diagram.png"
  return s;   // relative to index.html: works when the images folder sits next to the app
}

/** Is a relative image path covered by an attached file? (for the load summary) */
function assetFor(src) {
  const key = normAssetPath(src);
  if (assets.has(key)) return true;
  const base = key.split('/').pop();
  return [...assets.keys()].some(k => k.split('/').pop() === base);
}

/** After rich HTML is in the page: load its images, with a readable message if one fails. */
function hydrateRich(root) {
  if (!root) return;
  $$('img[data-src]', root).forEach(img => {
    const raw = img.dataset.src;
    const url = resolveImageSrc(raw);
    const fail = why => {
      const box = document.createElement('div');
      box.className = 'img-error';
      box.textContent = `Image not shown${img.alt ? ` (${img.alt})` : ''}: ${why} - ${raw.length > 70 ? raw.slice(0, 70) + '…' : raw}`;
      img.replaceWith(box);
    };
    if (!url) { fail('this kind of link is not allowed'); return; }
    img.addEventListener('error', () => fail(/^(data:|https?:)/i.test(raw) ? 'could not load it' : 'file not found. Attach the image file when loading the paper'), { once: true });
    if (img.getAttribute('src') !== url) img.src = url;
  });
  $$('.katex-display', root).forEach(el => { fitMath(el); mathFit?.observe(el); });
  if (!richReady()) renderMath(root);   // offline fallback: let MathLive render \( \) maths
}

/** Shrink a block equation that is wider than its column (down to 60%), so long chemical
 *  equations stay readable without a hidden scrollbar. Below 60% it scrolls sideways.
 *  The ResizeObserver re-fits when the column changes size or a hidden question is shown. */
const mathFit = window.ResizeObserver ? new ResizeObserver(es => es.forEach(e => fitMath(e.target))) : null;
function fitMath(el) {
  if (!el.isConnected || !el.clientWidth) return;
  el.style.fontSize = '';
  const over = el.scrollWidth / el.clientWidth;
  if (over > 1.01) el.style.fontSize = Math.max(0.6, 1 / over).toFixed(3) + 'em';
}

/** The original simple formatter, kept as the offline fallback. */
function formatRichBasic(text) {
  if (!text) return '';
  const maths = [];
  let src = String(text).replace(/\\\([\s\S]+?\\\)|\\\[[\s\S]+?\\\]|\$\$[\s\S]+?\$\$/g, m => {
    maths.push(m);
    return `\u0000${maths.length - 1}\u0000`;
  });
  src = esc(src);
  const inline = s => s
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*(?!\s)(.+?)\*(?=$|[\s).,;:!?])/g, '$1<em>$2</em>');
  const isTable = l => /^\s*\|/.test(l);
  const isBullet = l => /^\s*[-•]\s+/.test(l);

  const lines = src.split(/\r?\n/);
  let html = '';
  for (let i = 0; i < lines.length;) {
    if (isTable(lines[i])) {
      const rows = [];
      while (i < lines.length && isTable(lines[i])) rows.push(lines[i++]);
      html += tableHtml(rows, inline);
    } else if (isBullet(lines[i])) {
      const items = [];
      while (i < lines.length && isBullet(lines[i])) items.push(lines[i++].replace(/^\s*[-•]\s+/, ''));
      html += '<ul>' + items.map(t => `<li>${inline(t)}</li>`).join('') + '</ul>';
    } else if (!lines[i].trim()) {
      i++;
    } else {
      const para = [];
      while (i < lines.length && lines[i].trim() && !isTable(lines[i]) && !isBullet(lines[i])) para.push(lines[i++]);
      html += `<p>${inline(para.join('<br>'))}</p>`;
    }
  }
  return html.replace(/\u0000(\d+)\u0000/g, (_, n) => esc(maths[n]));
}

function tableHtml(rows, inline) {
  const cells = r => r.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
  const data = rows.filter(r => !/^[\s|:\-]+$/.test(r)); // drop |---|---| separators
  if (!data.length) return '';
  const [head, ...body] = data;
  return '<table><thead><tr>' + cells(head).map(c => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>'
    + body.map(r => '<tr>' + cells(r).map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('')
    + '</tbody></table>';
}

/** Renders \( \) maths inside an element, if MathLive is available. */
function renderMath(el) {
  if (!mathReady || !el) return;
  try { MathLive.renderMathInElement(el); } catch (e) { console.warn('Maths render failed', e); }
}

/** Converts a stored answer (text with \( LaTeX \)) into static HTML for printing. */
function answerToHtml(text) {
  return String(text).split(/(\\\([\s\S]*?\\\))/).map(part => {
    const m = part.match(/^\\\(([\s\S]*)\\\)$/);
    if (!m) return esc(part);
    if (window.katex) return texToHtml({ tex: m[1], display: false, raw: part });
    if (mathReady) {
      try { return MathLive.convertLatexToMarkup(m[1]); } catch { /* fall through */ }
    }
    return `<code>${esc(part)}</code>`;
  }).join('');
}

/** Word count: each equation counts as one word. */
function countWords(text) {
  const eqs = (text.match(/\\\([\s\S]*?\\\)/g) || []).length;
  const words = text.replace(/\\\([\s\S]*?\\\)/g, ' ').trim().split(/\s+/).filter(Boolean).length;
  return words + eqs;
}
