<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="420" height="260" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="none" stroke="#1a1d23" stroke-width="2">
  <title>Series circuit: cell, resistors R1 and R2, ammeter A and a voltmeter V across R2</title>
  <!-- outer wire loop -->
  <path d="M60 60 H120 M160 60 H220 M300 60 H360 V200 H250 M210 200 H60 V140 M60 116 V60"/>
  <!-- R1 and R2 -->
  <rect x="120" y="48" width="40" height="24" fill="#fff"/>
  <rect x="220" y="48" width="80" height="24" fill="#fff" stroke="none"/>
  <rect x="240" y="48" width="40" height="24" fill="#fff"/>
  <path d="M220 60 H240 M280 60 H300"/>
  <!-- cell (long line = positive terminal) -->
  <path d="M44 128 H76" stroke-width="2.5"/>
  <path d="M52 140 H68" stroke-width="5"/>
  <path d="M60 140 V160"/>
  <!-- ammeter -->
  <circle cx="230" cy="200" r="18" fill="#fff"/>
  <!-- voltmeter across R2 -->
  <path d="M230 60 V110 H244 M276 110 H290 V60"/>
  <circle cx="260" cy="110" r="16" fill="#fff"/>
  <g fill="#1a1d23" stroke="none" text-anchor="middle">
    <text x="140" y="40">R<tspan font-size="11" dy="4">1</tspan></text>
    <text x="260" y="40">R<tspan font-size="11" dy="4">2</tspan></text>
    <text x="230" y="206" font-family="Arial, sans-serif" font-weight="700">A</text>
    <text x="260" y="116" font-family="Arial, sans-serif" font-weight="700">V</text>
    <text x="26" y="146">ε</text>
  </g>
</svg>
